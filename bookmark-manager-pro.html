/* ============================================================
 *  查找重复
 * ============================================================ */
function findDuplicatesGrouped(scope) {
  const groups = new Map();
  function traverse(folder, pathArr) {
    for (const c of folder.children) {
      if (c.type === 'folder') { traverse(c, [...pathArr, c.title]); }
      else {
        const key = (c.url || '').trim().toLowerCase();
        if (!key) continue;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({
          node: c, parent: folder,
          path: [...pathArr, folder.title].join(' / '),
        });
      }
    }
  }
  traverse(scope, []);
  const result = [];
  groups.forEach((arr, url) => {
    if (arr.length > 1) result.push({ url, items: arr });
  });
  return result;
}

function findDupDialog() {
  if (!root) return;
  const scope = currentFolder || root;
  const groups = findDuplicatesGrouped(scope);

  if (!groups.length) {
    setStatus('没有发现重复书签');
    showModal('查找重复结果', `<p>范围：<b>${esc(scope.title)}</b></p><p style="color:var(--muted); margin-top:8px;">没有发现重复书签。</p>`);
    return;
  }

  const keepIndex = new Map();
  groups.forEach((g, i) => keepIndex.set(i, 0));

  function calcTotalDelete() {
    let total = 0;
    groups.forEach((g) => { total += g.items.length - 1; });
    return total;
  }

  const box = document.getElementById('modalBox');
  document.getElementById('modalMask').classList.add('show');

  function renderBody() {
    let leftHtml = '<div class="dup-left">';
    groups.forEach((g, gi) => {
      leftHtml += `<div class="dup-group" data-g="${gi}">`;
      leftHtml += `<div class="group-header" title="${escAttr(g.url)}">🔗 ${esc(g.url)}</div>`;
      g.items.forEach((it, ii) => {
        const keep = keepIndex.get(gi) === ii;
        leftHtml += `
          <label class="dup-row ${keep ? 'keep' : 'del'}" data-g="${gi}" data-i="${ii}">
            <input type="radio" name="dup-keep-${gi}" ${keep ? 'checked' : ''}>
            <span class="dup-title">${esc(it.node.title)}</span>
            <span class="dup-path" title="${escAttr(it.path)}">${esc(it.path)}</span>
          </label>
        `;
      });
      leftHtml += '</div>';
    });
    leftHtml += '</div>';

    const logLines = [];
    logLines.push(`# 重复书签报告`);
    logLines.push(`# 生成时间: ${new Date().toLocaleString()}`);
    logLines.push(`# 工具版本: v${APP_VERSION}`);
    logLines.push(`# 范围: ${scope.title}`);
    logLines.push(`# 重复组数: ${groups.length}`);
    logLines.push(`# 总待删除: ${calcTotalDelete()}`);
    logLines.push('');
    groups.forEach((g, gi) => {
      logLines.push(`[组 ${gi + 1}] ${g.url}`);
      g.items.forEach((it, ii) => {
        const keep = keepIndex.get(gi) === ii;
        logLines.push(`    ${keep ? '[保留]' : '[删除]'} ${it.node.title}`);
        logLines.push(`           位置: ${it.path}`);
      });
      logLines.push('');
    });
    const logText = logLines.join('\n');
    const escLog = logText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const rightHtml = `<div class="dup-right">${escLog}</div>`;

    box.innerHTML = `
      <h3>🔍 查找重复（共 ${groups.length} 组，待删除 ${calcTotalDelete()} 项）</h3>
      <div class="modal-body" style="overflow:hidden;">
        <p style="color:var(--muted); font-size:12px; margin-bottom:10px; flex-shrink:0;">
          范围：<b>${esc(scope.title)}</b>。每组内用单选决定保留哪一个，其余会被删除。
        </p>
        <div class="dup-layout" style="flex:1;">${leftHtml}${rightHtml}</div>
      </div>
      <div class="modal-actions">
        <button id="dupCancel">取消</button>
        <button class="primary" id="dupConfirm">确定删除选中的</button>
      </div>
    `;

    box.querySelectorAll('.dup-row').forEach(row => {
      row.onclick = (e) => {
        if (e.target.tagName === 'INPUT') return;
        const gi = parseInt(row.dataset.g, 10);
        const ii = parseInt(row.dataset.i, 10);
        keepIndex.set(gi, ii);
        renderBody();
      };
    });
    box.querySelectorAll('input[type=radio]').forEach(radio => {
      radio.onchange = () => {
        const row = radio.closest('.dup-row');
        const gi = parseInt(row.dataset.g, 10);
        const ii = parseInt(row.dataset.i, 10);
        keepIndex.set(gi, ii);
        renderBody();
      };
    });

    document.getElementById('dupCancel').onclick = () => { closeModal(); };
    document.getElementById('dupConfirm').onclick = () => {
      let cnt = 0;
      groups.forEach((g, gi) => {
        const keepIdx = keepIndex.get(gi);
        g.items.forEach((it, ii) => {
          if (ii === keepIdx) return;
          if (it.parent) it.parent.children = it.parent.children.filter(c => c.id !== it.node.id);
          cnt++;
        });
      });
      closeModal();
      renderTree(); renderList();
      if (searchQuery) doSearch(searchQuery);
      setStatus(`已删除 ${cnt} 个重复书签`);
    };
  }

  renderBody();

  box.style.width = Math.min(window.innerWidth * 0.9, 1200) + 'px';
  box.style.height = Math.min(window.innerHeight * 0.85, 800) + 'px';
}

/* ============================================================
 *  批量改名
 * ============================================================ */
const renameRule = {
  trim:     { enabled: false, head: '', headN: 1, tail: '', tailN: 1, caseSensitive: false, emptyIfNotFound: false },
  replace:  { enabled: false, find: '', repl: '', nth: '', caseSensitive: false },
  del:      { enabled: false, dir: 'head', start: 1, count: 1 },
  number:   { enabled: false, tpl: '#. <SELF>', start: 1, step: 1, pad: 1 },
  affix:    { enabled: false, prefix: '', suffix: '', atN: '' },
  regex:    { enabled: false, pattern: '', repl: '', target: 'title' },
};
const renameScope = { folders: true, bookmarks: true };
let renameActiveTab = 'trim';
let isPreviewMarquee = false;

let renameUndoStack = [];
let renameRedoStack = [];

function applyRuleTrim(text, r) {
  if (!text) return text;
  let start = 0, end = text.length;
  if (r.head) {
    const pos = findNth(text, r.head, r.headN, r.caseSensitive);
    if (pos === -1) return r.emptyIfNotFound ? '' : text;
    start = pos.idx;
  }
  if (r.tail) {
    const pos = findNth(text, r.tail, r.tailN, r.caseSensitive);
    if (pos === -1) return r.emptyIfNotFound ? '' : text;
    end = pos.idx + r.tail.length;
  }
  if (end < start) return text;
  return text.slice(start, end);
}
function findNth(text, needle, n, caseSensitive) {
  if (n < 1) n = 1;
  const t = caseSensitive ? text : text.toLowerCase();
  const nd = caseSensitive ? needle : needle.toLowerCase();
  let idx = -1, from = 0, count = 0;
  while (true) {
    idx = t.indexOf(nd, from);
    if (idx === -1) return -1;
    count++;
    if (count === n) return { idx };
    from = idx + 1;
  }
}
function applyRuleReplace(text, r) {
  if (!r.find) return text;
  const flags = 'g' + (r.caseSensitive ? '' : 'i');
  let re;
  try { re = new RegExp(escapeReg(r.find), flags); }
  catch (e) { return text; }
  if (r.nth) {
    const n = parseInt(r.nth, 10);
    if (!isNaN(n) && n > 0) {
      let i = 0;
      return text.replace(re, (m) => (++i === n ? (r.repl || '') : m));
    }
  }
  return text.replace(re, r.repl || '');
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function applyRuleDel(text, r) {
  const start = parseInt(r.start, 10) || 1;
  const count = parseInt(r.count, 10) || 1;
  if (r.dir === 'head') {
    return text.slice(0, start - 1) + text.slice(start - 1 + count);
  } else {
    const idx = text.length - (start - 1) - count;
    if (idx < 0) return text.slice(0, Math.max(0, text.length - (start - 1) - count) + count);
    return text.slice(0, idx) + text.slice(idx + count);
  }
}
function applyRuleNumber(text, r, index) {
  const n = (parseInt(r.start, 10) || 1) + index * (parseInt(r.step, 10) || 1);
  const pad = parseInt(r.pad, 10) || 1;
  const num = String(n).padStart(pad, '0');
  let tpl = r.tpl || '<SELF>';
  if (!tpl.includes('<SELF>')) tpl = tpl + ' <SELF>';
  return tpl.replace(/#/g, num).replace(/<SELF>/g, text);
}
function applyRuleAffix(text, r) {
  let t = text;
  if (r.atN) {
    const n = parseInt(r.atN, 10);
    if (!isNaN(n) && n > 0 && n <= t.length + 1) {
      t = t.slice(0, n - 1) + (r.prefix || '') + t.slice(n - 1) + (r.suffix || '');
      return t;
    }
  }
  return (r.prefix || '') + t + (r.suffix || '');
}
function applyRuleRegex(text, r) {
  if (!r.pattern) return text;
  let re;
  try { re = new RegExp(r.pattern, 'g'); }
  catch (e) { return text; }
  return text.replace(re, r.repl || '');
}
function applyAllRules(title, index, type) {
  let t = title;
  if (renameRule.trim.enabled) t = applyRuleTrim(t, renameRule.trim);
  if (renameRule.replace.enabled) t = applyRuleReplace(t, renameRule.replace);
  if (renameRule.del.enabled) t = applyRuleDel(t, renameRule.del);
  if (renameRule.affix.enabled) t = applyRuleAffix(t, renameRule.affix);
  if (renameRule.regex.enabled) t = applyRuleRegex(t, renameRule.regex);
  if (renameRule.number.enabled) t = applyRuleNumber(t, renameRule.number, index);
  return t;
}

function openRenameDialog() {
  renameUndoStack = [];
  renameRedoStack = [];
  const ids = [...selectedIds];
  const listItems = searchQuery ? currentSearchResults : getVisibleItems();
  let targets;
  if (ids.length) {
    targets = ids.map(id => findById(id)).filter(x => x && x.node !== root);
  } else {
    targets = (currentFolder ? currentFolder.children : []).map(n => ({ node: n }));
  }

  if (!targets.length) {
    alert('没有可改名的项。请先选中项目，或进入某个有内容的文件夹。');
    return;
  }

  const tabs = [
    { id: 'trim',    label: '裁剪' },
    { id: 'replace', label: '替换' },
    { id: 'del',     label: '删除' },
    { id: 'number',  label: '序号' },
    { id: 'affix',   label: '前后缀' },
    { id: 'regex',   label: '正则' },
  ];

  if (!window.__renameChecked) window.__renameChecked = new Map();
  targets.forEach(t => {
    if (!window.__renameChecked.has(t.node.id)) window.__renameChecked.set(t.node.id, true);
  });

  if (!window.__previewColWidths) window.__previewColWidths = { old: 400, new: 400 };
  if (!window.__previewSort) window.__previewSort = { key: null, dir: 1 };

  const box = document.getElementById('modalBox');
  document.getElementById('modalMask').classList.add('show');
  box.innerHTML = `
    <h3>✏️ 批量改名</h3>
    <div class="modal-body">
      <div style="display:flex; gap:16px; align-items:center; margin-bottom:10px; flex-wrap:wrap; flex-shrink:0;">
        <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
          <input type="checkbox" id="scope-folder" ${renameScope.folders ? 'checked' : ''}> 应用于文件夹
        </label>
        <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text); cursor:pointer;">
          <input type="checkbox" id="scope-bookmark" ${renameScope.bookmarks ? 'checked' : ''}> 应用于书签
        </label>
        <span style="color:var(--muted); font-size:12px; margin-left:auto;">
          共 ${targets.length} 项
        </span>
        <button id="renameUndo" title="撤销上一次应用">↶ 撤销</button>
        <button id="renameRedo" title="重做">↷ 重做</button>
      </div>
      <div class="tabs" id="renameTabs"></div>
      <div class="tab-panel" id="tabPanel"></div>
      <div class="preview-wrap" id="previewWrap">
        <div class="preview-inner" id="previewInner"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="renameCancel">取消</button>
      <button class="primary" id="renameApply">应用</button>
    </div>
    <div class="modal-resize-hint"></div>
  `;

  const w = Math.min(window.innerWidth * 0.9, 1400);
  const h = Math.min(window.innerHeight * 0.9, w * 9 / 16);
  box.style.width = w + 'px';
  box.style.height = h + 'px';
  box.style.maxWidth = '96vw';
  box.style.maxHeight = '92vh';
  box.style.overflow = 'hidden';

  const tabBarEl = document.getElementById('renameTabs');
  const panelEl = document.getElementById('tabPanel');
  const previewInnerEl = document.getElementById('previewInner');
  const undoBtn = document.getElementById('renameUndo');
  const redoBtn = document.getElementById('renameRedo');

  function updateUndoRedoButtons() {
    undoBtn.disabled = renameUndoStack.length === 0;
    redoBtn.disabled = renameRedoStack.length === 0;
  }

  document.getElementById('scope-folder').onchange = (e) => {
    renameScope.folders = e.target.checked;
    refreshPreview();
  };
  document.getElementById('scope-bookmark').onchange = (e) => {
    renameScope.bookmarks = e.target.checked;
    refreshPreview();
  };
  document.getElementById('renameCancel').onclick = () => { closeModal(); renderList(); };
  document.getElementById('renameApply').onclick = () => {
    const checked = getCheckedPreviewIds();
    if (!checked.size) { alert('请至少勾选一条要改名的项'); return; }
    renameUndoStack.push(JSON.stringify(root));
    renameRedoStack = [];

    let folderIdx = 0, bmIdx = 0, cnt = 0;
    for (const t of targets) {
      const type = t.node.type;
      if (type === 'folder' && !renameScope.folders) continue;
      if (type === 'bookmark' && !renameScope.bookmarks) continue;
      if (!checked.has(t.node.id)) continue;
      const idx = type === 'folder' ? folderIdx++ : bmIdx++;
      t.node.title = applyAllRules(t.node.title, idx, type);
      cnt++;
    }
    renderTree(); renderList();
    if (searchQuery) doSearch(searchQuery);
    refreshPreview();
    setStatus(`已批量改名 ${cnt} 个项，可点「↶ 撤销」撤回`);
    updateUndoRedoButtons();
  };
  undoBtn.onclick = () => {
    if (!renameUndoStack.length) return;
    renameRedoStack.push(JSON.stringify(root));
    root = JSON.parse(renameUndoStack.pop());
    if (currentFolder) {
      const found = findById(currentFolder.id);
      currentFolder = found ? found.node : root;
    }
    targets = (selectedIds.size
      ? [...selectedIds].map(id => findById(id)).filter(x => x && x.node !== root)
      : (currentFolder ? currentFolder.children : []).map(n => ({ node: n })));
    renderTree(); renderList();
    if (searchQuery) doSearch(searchQuery);
    refreshPreview();
    setStatus('已撤销');
    updateUndoRedoButtons();
  };
  redoBtn.onclick = () => {
    if (!renameRedoStack.length) return;
    renameUndoStack.push(JSON.stringify(root));
    root = JSON.parse(renameRedoStack.pop());
    if (currentFolder) {
      const found = findById(currentFolder.id);
      currentFolder = found ? found.node : root;
    }
    targets = (selectedIds.size
      ? [...selectedIds].map(id => findById(id)).filter(x => x && x.node !== root)
      : (currentFolder ? currentFolder.children : []).map(n => ({ node: n })));
    renderTree(); renderList();
    if (searchQuery) doSearch(searchQuery);
    refreshPreview();
    setStatus('已重做');
    updateUndoRedoButtons();
  };

  function renderTabs() {
    tabBarEl.innerHTML = tabs.map(t => {
      const enabled = renameRule[t.id].enabled;
      return `<div class="tab ${renameActiveTab === t.id ? 'active' : ''}" data-tab="${t.id}">
        ${t.label}${enabled ? '<span class="dot"></span>' : ''}
      </div>`;
    }).join('');
    tabBarEl.querySelectorAll('.tab').forEach(el => {
      el.onclick = () => {
        saveTabPanel();
        renameActiveTab = el.dataset.tab;
        renderTabs();
        renderTabPanel();
      };
    });
  }

  function saveTabPanel() {
    const t = renameActiveTab;
    const r = renameRule[t];
    const q = (id) => document.getElementById(id);
    if (!q('r-enabled')) return;
    if (t === 'trim') {
      r.head = q('r-head').value;
      r.headN = parseInt(q('r-headN').value, 10) || 1;
      r.tail = q('r-tail').value;
      r.tailN = parseInt(q('r-tailN').value, 10) || 1;
      r.caseSensitive = q('r-trimCase').checked;
      r.emptyIfNotFound = q('r-trimEmpty').checked;
    } else if (t === 'replace') {
      r.find = q('r-find').value;
      r.repl = q('r-repl').value;
      r.nth = q('r-replNth').value;
      r.caseSensitive = q('r-replCase').checked;
    } else if (t === 'del') {
      r.dir = q('r-delDir').value;
      r.start = parseInt(q('r-delStart').value, 10) || 1;
      r.count = parseInt(q('r-delCount').value, 10) || 1;
    } else if (t === 'number') {
      r.tpl = q('r-numTpl').value;
      r.start = parseInt(q('r-numStart').value, 10) || 1;
      r.step = parseInt(q('r-numStep').value, 10) || 1;
      r.pad = parseInt(q('r-numPad').value, 10) || 1;
    } else if (t === 'affix') {
      r.prefix = q('r-affPrefix').value;
      r.suffix = q('r-affSuffix').value;
      r.atN = q('r-affAtN').value;
    } else if (t === 'regex') {
      r.pattern = q('r-regexPattern').value;
      r.repl = q('r-regexRepl').value;
      r.target = q('r-regexTarget').value;
    }
  }

  function renderTabPanel() {
    const r = renameRule[renameActiveTab];
    const enabled = r.enabled;
    let html = `<div class="enable-row">
      <input type="checkbox" id="r-enabled" ${enabled ? 'checked' : ''}>
      <label for="r-enabled" style="margin:0; color:var(--text); cursor:pointer;">启用此规则</label>
    </div>`;

    if (renameActiveTab === 'trim') {
      html += `
        <div class="panel-row">
          <div><label>开头词（留空 = 从头）</label>
            <input type="text" id="r-head" value="${escAttr(r.head)}" placeholder="例如 开头词"></div>
          <div class="small"><label>第几个</label>
            <input type="number" id="r-headN" value="${r.headN}" min="1"></div>
        </div>
        <div class="panel-row">
          <div><label>结尾词（留空 = 到尾）</label>
            <input type="text" id="r-tail" value="${escAttr(r.tail)}" placeholder="例如 结尾词"></div>
          <div class="small"><label>第几个</label>
            <input type="number" id="r-tailN" value="${r.tailN}" min="1"></div>
        </div>
        <div style="display:flex; gap:20px; margin-top:10px;">
          <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text);">
            <input type="checkbox" id="r-trimCase" ${r.caseSensitive ? 'checked' : ''}> 区分大小写
          </label>
          <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text);">
            <input type="checkbox" id="r-trimEmpty" ${r.emptyIfNotFound ? 'checked' : ''}> 找不到锚点时删空
          </label>
        </div>
        <p class="hint">
          从「开头词」开始保留到「结尾词」结束，两头多余内容删掉。<br>
          例：开头词填 <code>[开头词]</code>，结尾词填 <code>[结尾词]</code><br>
          → <code>[开头词] xxx yyy [结尾词] zzz</code><br>
          → <code>[开头词] xxx yyy [结尾词]</code>
        </p>
      `;
    } else if (renameActiveTab === 'replace') {
      html += `
        <div class="panel-row">
          <div><label>查找</label>
            <input type="text" id="r-find" value="${escAttr(r.find)}" placeholder="要查找的文字"></div>
          <div><label>替换为（留空 = 删除）</label>
            <input type="text" id="r-repl" value="${escAttr(r.repl)}"></div>
          <div class="small"><label>第几个（空=全部）</label>
            <input type="number" id="r-replNth" value="${escAttr(r.nth)}" min="1"></div>
        </div>
        <label style="display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--text);">
          <input type="checkbox" id="r-replCase" ${r.caseSensitive ? 'checked' : ''}> 区分大小写
        </label>
        <p class="hint">例：查找 <code>[查找词]</code>，替换留空 → 删除所有「查找词」。<br>第几个留空 = 替换全部；填 2 = 只替换第 2 个匹配。</p>
      `;
    } else if (renameActiveTab === 'del') {
      html += `
        <div class="panel-row">
          <div><label>方向</label>
            <select id="r-delDir">
              <option value="head" ${r.dir === 'head' ? 'selected' : ''}>从头</option>
              <option value="tail" ${r.dir === 'tail' ? 'selected' : ''}>从尾</option>
            </select></div>
          <div><label>从第 N 个字符开始</label>
            <input type="number" id="r-delStart" value="${r.start}" min="1"></div>
          <div><label>删除 M 个字符</label>
            <input type="number" id="r-delCount" value="${r.count}" min="1"></div>
        </div>
        <p class="hint">例：从头、第 1 个字符开始、删 5 个 → 删掉开头 5 个字。</p>
      `;
    } else if (renameActiveTab === 'number') {
      html += `
        <label>模板（<code>#</code> = 序号，<code>&lt;SELF&gt;</code> = 原标题）</label>
        <input type="text" id="r-numTpl" value="${escAttr(r.tpl)}">
        <div class="panel-row">
          <div><label>起始</label>
            <input type="number" id="r-numStart" value="${r.start}"></div>
          <div><label>步长</label>
            <input type="number" id="r-numStep" value="${r.step}"></div>
          <div><label>位数（补零）</label>
            <input type="number" id="r-numPad" value="${r.pad}" min="1"></div>
        </div>
        <p class="hint">
          例：模板 <code>#. &lt;SELF&gt;</code>，位数 2 → <code>01. 原标题</code>、<code>02. 原标题</code>…<br>
          文件夹和书签各自独立计数。
        </p>
      `;
    } else if (renameActiveTab === 'affix') {
      html += `
        <div class="panel-row">
          <div><label>前缀</label>
            <input type="text" id="r-affPrefix" value="${escAttr(r.prefix)}"></div>
          <div><label>后缀</label>
            <input type="text" id="r-affSuffix" value="${escAttr(r.suffix)}"></div>
        </div>
        <label>从第 N 个字符位置插入（留空 = 直接首尾拼接）</label>
        <input type="number" id="r-affAtN" value="${escAttr(r.atN)}" min="1">
        <p class="hint">例：前缀填 <code>[前缀] </code>，留空 N → <code>[前缀] 原标题</code></p>
      `;
    } else if (renameActiveTab === 'regex') {
      html += `
        <label>作用范围</label>
        <select id="r-regexTarget">
          <option value="title" ${r.target === 'title' ? 'selected' : ''}>仅标题</option>
          <option value="url" ${r.target === 'url' ? 'selected' : ''}>仅网址</option>
          <option value="both" ${r.target === 'both' ? 'selected' : ''}>标题和网址</option>
        </select>
        <label>正则模式</label>
        <input type="text" id="r-regexPattern" value="${escAttr(r.pattern)}" placeholder="例如 ^(.+?) \\|.*$">
        <label>替换为（$1 $2 捕获组，留空 = 删除）</label>
        <input type="text" id="r-regexRepl" value="${escAttr(r.repl)}" placeholder="$1">
        <p class="hint">高级用法。示例：模式 <code>^(.+?) \\|.*$</code> 替换 <code>$1</code> → 保留第一个竖线之前的内容。</p>
      `;
    }

    panelEl.innerHTML = html;

    document.getElementById('r-enabled').onchange = (e) => {
      renameRule[renameActiveTab].enabled = e.target.checked;
      renderTabs();
      refreshPreview();
    };
    panelEl.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => { saveTabPanel(); refreshPreview(); });
      el.addEventListener('change', () => { saveTabPanel(); refreshPreview(); });
    });
  }

  function refreshPreview() {
    if (!previewInnerEl) return;

    const visible = targets.filter(t => {
      const type = t.node.type;
      if (type === 'folder' && !renameScope.folders) return false;
      if (type === 'bookmark' && !renameScope.bookmarks) return false;
      return true;
    });

    // 排序
    let sortedVisible = visible.slice();
    if (window.__previewSort && window.__previewSort.key) {
      const k = window.__previewSort.key;
      const d = window.__previewSort.dir;
      sortedVisible.sort((a, b) => {
        const idxA = targets.indexOf(a);
        const idxB = targets.indexOf(b);
        let va = '', vb = '';
        if (k === 'old') { va = a.node.title || ''; vb = b.node.title || ''; }
        if (k === 'new') {
          va = applyAllRules(a.node.title || '', idxA, a.node.type);
          vb = applyAllRules(b.node.title || '', idxB, b.node.type);
        }
        if (va < vb) return -1 * d;
        if (va > vb) return 1 * d;
        return 0;
      });
    }

    const wOld = Math.max(50, window.__previewColWidths.old || 400);
    const wNew = Math.max(50, window.__previewColWidths.new || 400);
    const curSort = window.__previewSort || { key: null, dir: 1 };

    const arrowOld = curSort.key === 'old' ? (curSort.dir === 1 ? ' ▲' : ' ▼') : '';
    const arrowNew = curSort.key === 'new' ? (curSort.dir === 1 ? ' ▲' : ' ▼') : '';
    const allChecked = sortedVisible.every(t => window.__renameChecked.get(t.node.id) !== false);

    // ---------- 构建 table ----------
    let html = '<table class="preview-table">';
    // colgroup：列宽的唯一真相来源
    html += '<colgroup>';
    html += '<col style="width:34px">';               // 勾选列
    html += `<col style="width:${wOld}px">`;           // 原始标题
    html += `<col style="width:${wNew}px">`;           // 改后标题
    html += '<col>';                                    // 空气列（自动吃掉剩余）
    html += '</colgroup>';

    // thead
    html += '<thead><tr>';
    // 勾选列
    html += `<th class="preview-th-chk"><span class="preview-th-label"><input type="checkbox" id="previewCheckAll" ${allChecked ? 'checked' : ''}></span></th>`;
    // 原始标题
    html += `<th data-pkey="old"><span class="preview-th-label">原始标题${arrowOld}</span><div class="preview-th-resizer" data-pkey="old"></div></th>`;
    // 改后标题
    html += `<th data-pkey="new"><span class="preview-th-label">改后标题${arrowNew}</span><div class="preview-th-resizer" data-pkey="new"></div></th>`;
    // 空气列
    html += `<th class="preview-th-air"></th>`;
    html += '</tr></thead>';

    // tbody
    html += '<tbody>';
    sortedVisible.forEach(t => {
      const type = t.node.type;
      const originalIdx = targets.indexOf(t);
      const oldT = t.node.title || '';
      const newT = applyAllRules(oldT, originalIdx, type);
      const checked = window.__renameChecked.get(t.node.id) !== false;
      const folderMark = type === 'folder' ? '📁 ' : '';

      html += `<tr class="${checked ? '' : 'disabled'}" data-id="${t.node.id}">`;
      html += `  <td class="preview-td-chk"><input type="checkbox" class="preview-chk" data-id="${t.node.id}" ${checked ? 'checked' : ''}></td>`;
      html += `  <td class="preview-td-old" title="${escAttr(oldT)}">${esc(folderMark + oldT)}</td>`;
      html += `  <td class="preview-td-new" title="${escAttr(newT)}">${esc(folderMark + newT)}</td>`;
      html += `  <td class="preview-td-air"></td>`;
      html += `</tr>`;
    });
    html += '</tbody></table>';
    // 增加表尾空气区，确保下方有足够空间进行框选
    html += '<div class="preview-air-footer"></div>';

    previewInnerEl.innerHTML = html;

    // ---------- 勾选交互 ----------
    const chkAll = document.getElementById('previewCheckAll');
    if (chkAll) {
      chkAll.onchange = (e) => {
        previewInnerEl.querySelectorAll('.preview-chk').forEach(cb => {
          cb.checked = e.target.checked;
          window.__renameChecked.set(cb.dataset.id, e.target.checked);
          cb.closest('tr').classList.toggle('disabled', !e.target.checked);
        });
      };
    }
    previewInnerEl.querySelectorAll('.preview-chk').forEach(cb => {
      cb.onchange = () => {
        window.__renameChecked.set(cb.dataset.id, cb.checked);
        cb.closest('tr').classList.toggle('disabled', !cb.checked);
      };
    });

    // ---------- 表头点击排序 ----------
    previewInnerEl.querySelectorAll('th[data-pkey]').forEach(th => {
      const label = th.querySelector('.preview-th-label');
      label.onclick = (e) => {
        e.stopPropagation();
        const key = th.dataset.pkey;
        if (window.__previewSort.key === key) {
          window.__previewSort.dir = -window.__previewSort.dir;
        } else {
          window.__previewSort.key = key;
          window.__previewSort.dir = 1;
        }
        refreshPreview();
      };
    });

    // ---------- Splitter 拖拽（直接改 colgroup，边拖边刷） ----------
    previewInnerEl.querySelectorAll('.preview-th-resizer').forEach(sp => {
      sp.onmousedown = (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const key = sp.dataset.pkey;
        const colIndex = key === 'old' ? 1 : 2; // colgroup 里的索引
        const colEl = previewInnerEl.querySelector(`colgroup col:nth-child(${colIndex + 1})`);
        const startX = e.clientX;
        const startW = window.__previewColWidths[key] || 400;

        sp.classList.add('dragging');
        document.body.classList.add('col-resizing');

        const onMove = (ev) => {
          let w = startW + (ev.clientX - startX);
          if (w < 50) w = 50;
          if (w > 1200) w = 1200;
          window.__previewColWidths[key] = w;
          // 直接改 col 宽度：table-layout: fixed 下立即生效，不会影响另一列
          if (colEl) colEl.style.width = w + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          sp.classList.remove('dragging');
          document.body.classList.remove('col-resizing');
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };

      // 双击自适应：按该列最长内容算宽度
      sp.ondblclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        const key = sp.dataset.pkey;
        const tdClass = key === 'old' ? '.preview-td-old' : '.preview-td-new';
        const samples = previewInnerEl.querySelectorAll(tdClass);
        let maxW = 60;
        const meas = document.createElement('span');
        meas.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:12px "Segoe UI","Microsoft YaHei",sans-serif;';
        document.body.appendChild(meas);
        samples.forEach(el => {
          meas.textContent = el.textContent;
          const w = meas.getBoundingClientRect().width + 20;
          if (w > maxW) maxW = w;
        });
        document.body.removeChild(meas);
        window.__previewColWidths[key] = Math.min(maxW, 800);
        refreshPreview();
      };
    });

    // ---------- 终极无敌版框选：视觉记忆锁定法 ----------
    if (!previewInnerEl.dataset.marqueeInit) {
      previewInnerEl.dataset.marqueeInit = 'true';
      let startX = 0, startY = 0;
      let baseChecked = new Map();
      let draggedIds = new Set(); // 记录本次拖拽中，所有曾经碰到过的行 ID

      previewInnerEl.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('thead') || e.target.classList.contains('preview-chk') || e.target.classList.contains('preview-th-resizer')) return;

        e.preventDefault();
        isPreviewMarquee = true;
        startX = e.clientX;
        startY = e.clientY;
        draggedIds.clear(); // 每次拖拽开始，清空历史记录

        // 1. 备份拖拽前的状态
        baseChecked.clear();
        previewInnerEl.querySelectorAll('tbody tr').forEach(tr => {
          const cb = tr.querySelector('.preview-chk');
          if (cb) baseChecked.set(cb.dataset.id, cb.checked);
        });

        const box = document.createElement('div');
        box.className = 'marquee';
        box.style.display = 'block';
        if (!box.parentNode) document.body.appendChild(box);

        const updateMarquee = (clientX, clientY) => {
          if (!isPreviewMarquee) return;

          // 画框
          const x1 = Math.min(startX, clientX), y1 = Math.min(startY, clientY);
          const x2 = Math.max(startX, clientX), y2 = Math.max(startY, clientY);
          box.style.left = x1 + 'px'; box.style.top = y1 + 'px';
          box.style.width = (x2 - x1) + 'px'; box.style.height = (y2 - y1) + 'px';

          // 判定当前视口内的行
          previewInnerEl.querySelectorAll('tbody tr').forEach(tr => {
            const rr = tr.getBoundingClientRect();
            // 只要这一行的顶部、底部、或者整个行只要有一丝丝在屏幕框内，就算命中
            const hit = !(rr.right < x1 || rr.left > x2 || rr.bottom < y1 || rr.top > y2);

            const cb = tr.querySelector('.preview-chk');
            if (cb && hit) {
              // 核心：只要撞到了，就把它加入记忆集合！
              draggedIds.add(cb.dataset.id);
            }
          });

          // 统一更新状态
          previewInnerEl.querySelectorAll('tbody tr').forEach(tr => {
            const cb = tr.querySelector('.preview-chk');
            if (cb) {
              // 最终判定：如果在记忆集合里，说明它在这个拖拽过程中被碰过。
              // 如果碰过：反转它的初始状态（全选的变取消，没选的变选中）。
              // 如果没碰过：保持初始状态。
              const isChecked = draggedIds.has(cb.dataset.id) ? !baseChecked.get(cb.dataset.id) : baseChecked.get(cb.dataset.id);

              if (cb.checked !== isChecked) {
                cb.checked = isChecked;
                window.__renameChecked.set(cb.dataset.id, isChecked);
                tr.classList.toggle('disabled', !isChecked);
              }
            }
          });
        };

        const onMove = (ev) => {
          window.__lastMarqueeEv = ev;
          updateMarquee(ev.clientX, ev.clientY);
        };

        const onScroll = () => {
          if (!isPreviewMarquee || !window.__lastMarqueeEv) return;
          updateMarquee(window.__lastMarqueeEv.clientX, window.__lastMarqueeEv.clientY);
        };

        const onUp = () => {
          isPreviewMarquee = false;
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          previewInnerEl.parentElement.removeEventListener('scroll', onScroll);
          if (box.parentNode) box.parentNode.removeChild(box);
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        previewInnerEl.parentElement.addEventListener('scroll', onScroll);
      });
    }
  }

  function getCheckedPreviewIds() {
    const out = new Set();
    previewInnerEl.querySelectorAll('.preview-chk').forEach(cb => {
      if (cb.checked) out.add(cb.dataset.id);
    });
    return out;
  }

  renderTabs();
  renderTabPanel();
  refreshPreview();
  updateUndoRedoButtons();
}

/* ============================================================
 *  失效检测
 * ============================================================ */
async function checkLinks() {
  if (!currentFolder && !searchQuery) return;
  const items = (searchQuery ? currentSearchResults : getVisibleItems()).filter(i => i.type === 'bookmark');
  if (!items.length) { setStatus('当前视图没有书签'); return; }
  if (items.length > 200 && !confirm(`当前有 ${items.length} 个书签，检测可能较慢。继续？`)) return;

  setStatus('开始检测 ' + items.length + ' 个链接...');
  let done = 0, ok = 0, bad = 0, idx = 0;
  const CONCURRENCY = 8;

  async function worker() {
    while (idx < items.length) {
      const it = items[idx++];
      it.linkStatus = 'pending';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        await fetch(it.url, { method: 'GET', mode: 'no-cors', signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        it.linkStatus = 'ok'; ok++;
      } catch (e) { it.linkStatus = 'bad'; bad++; }
      done++;
      if (done % 5 === 0 || done === items.length) {
        setStatus(`检测进度 ${done}/${items.length}（可用 ${ok}，疑似失效 ${bad}）`);
        if (searchQuery) doSearch(searchQuery); else renderList();
      }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  if (searchQuery) doSearch(searchQuery); else renderList();
  setStatus(`检测完成：可用 ${ok}，疑似失效 ${bad}（浏览器限制，仅供参考）`);
}

/* ============================================================
 *  搜索
 * ============================================================ */
let currentSearchResults = [];
function doSearch(q) {
  searchQuery = q.trim();
  if (!searchQuery) { currentSearchResults = []; renderList(); return; }
  if (!root) return;
  const results = [];
  const ql = searchQuery.toLowerCase();
  walkAll(root, (n) => {
    if (n.type === 'bookmark' &&
        ((n.title || '').toLowerCase().includes(ql) || (n.url || '').toLowerCase().includes(ql))) {
      results.push(n);
    }
  });
  currentSearchResults = results;
  renderList();
}

/* ============================================================
 *  框选
 * ============================================================ */
function setupMarquee() {
  const listEl = document.getElementById('list');
  const box = document.getElementById('marquee');
  let dragging = false, startX = 0, startY = 0, additive = false;

  listEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (editingId) {
      if (e.target.closest('.inline-edit')) return;
      const input = document.querySelector('.inline-edit');
      if (input) input.blur();
      return;
    }
    if (e.target.closest('.list-item')) return;
    dragging = true;
    additive = e.ctrlKey || e.metaKey;
    startX = e.clientX; startY = e.clientY;
    box.style.display = 'block';
    box.style.left = startX + 'px'; box.style.top = startY + 'px';
    box.style.width = '0px'; box.style.height = '0px';
    if (!additive) { selectedIds.clear(); updateSelectionInfo(); }
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const x1 = Math.min(startX, e.clientX), y1 = Math.min(startY, e.clientY);
    const x2 = Math.max(startX, e.clientX), y2 = Math.max(startY, e.clientY);
    box.style.left = x1 + 'px'; box.style.top = y1 + 'px';
    box.style.width = (x2 - x1) + 'px'; box.style.height = (y2 - y1) + 'px';
    const rect = { left: x1, top: y1, right: x2, bottom: y2 };
    const rows = listEl.querySelectorAll('.list-item');
    const newSel = additive ? new Set(selectedIds) : new Set();
    rows.forEach(r => {
      const rr = r.getBoundingClientRect();
      const hit = !(rr.right < rect.left || rr.left > rect.right || rr.bottom < rect.top || rr.top > rect.bottom);
      if (hit) newSel.add(r.dataset.id);
    });
    rows.forEach(r => {
      if (newSel.has(r.dataset.id)) r.classList.add('selected');
      else r.classList.remove('selected');
    });
    selectedIds = newSel;
    updateSelectionInfo();
  });
  document.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    box.style.display = 'none';
    updateSelectionInfo();
    if (Math.abs(e.clientX - startX) < 4 && Math.abs(e.clientY - startY) < 4) {
      if (!additive) {
        selectedIds.clear();
        document.querySelectorAll('.list-item.selected').forEach(el => el.classList.remove('selected'));
        updateSelectionInfo();
      }
    }
  });
}

/* ============================================================
 *  右键菜单
 * ============================================================ */
function showContextMenu(x, y, node) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = '';
  const add = (label, fn, danger = false) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (danger) b.className = 'danger';
    b.onclick = () => { hideContextMenu(); fn(); };
    menu.appendChild(b);
  };
  const sep = () => menu.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));

  if (node.type === 'bookmark') {
    add('🔗 打开链接', () => window.open(node.url, '_blank'));
    add('✏️ 重命名 (F2)', () => beginInlineEdit(node));
    add('🌐 编辑 URL', () => {
      const url = prompt('新 URL：', node.url);
      if (url !== null) { node.url = url; if (searchQuery) doSearch(searchQuery); else renderList(); }
    });
    sep();
    add('📋 复制 URL', () => navigator.clipboard.writeText(node.url));
  } else {
    add('✏️ 重命名 (F2)', () => beginInlineEdit(node));
    add('📁 在此新建文件夹', () => {
      const name = prompt('新文件夹名称：', '新建文件夹');
      if (name !== null) {
        const f = newFolder(name.trim() || '新建文件夹');
        node.children.unshift(f);
        renderTree(); renderList();
        beginInlineEdit(f);
      }
    });
  }
  sep();
  add('💾 导出选中项为 HTML', () => exportSelected());
  add('✏️ 批量改名', () => openRenameDialog());
  sep();
  if (selectedIds.size > 1) {
    add(`🗑 删除选中的 ${selectedIds.size} 项`, deleteSelected, true);
  } else {
    add('🗑 删除', () => {
      if (node === root) { alert('不能删除根'); return; }
      if (!confirm('确定删除「' + node.title + '」？')) return;
      const r = findById(node.id);
      if (r && r.parent) r.parent.children = r.parent.children.filter(c => c.id !== node.id);
      if (currentFolder === node) currentFolder = r.parent || root;
      renderTree(); if (searchQuery) doSearch(searchQuery); else renderList();
    }, true);
  }
  menu.style.left = x + 'px'; menu.style.top = y + 'px'; menu.style.display = 'block';
}
function hideContextMenu() { document.getElementById('ctxMenu').style.display = 'none'; }
document.addEventListener('click', hideContextMenu);

/* ============================================================
 *  弹窗 / 关于 / 状态栏
 * ============================================================ */
function showModal(title, bodyHtml, buttons = [{ label: '关闭', action: closeModal }]) {
  const box = document.getElementById('modalBox');
  box.style.width = '';
  box.style.height = '';
  box.style.maxWidth = '96vw';
  box.style.maxHeight = '92vh';
  box.innerHTML = `<h3>${title}</h3><div class="modal-body">${bodyHtml}</div>`;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.primary) btn.className = 'primary';
    btn.onclick = b.action;
    actions.appendChild(btn);
  }
  box.appendChild(actions);
  document.getElementById('modalMask').classList.add('show');
}
function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
}
document.getElementById('modalMask').onclick = (e) => {

};

function setStatus(s) { document.getElementById('status').textContent = s; }
function updateSelectionInfo() {
  document.getElementById('selectionInfo').textContent = selectedIds.size ? `已选中 ${selectedIds.size} 项` : '';
}

/* ============================================================
 *  导入
 * ============================================================ */
function importFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const newRoot = parseBookmarks(e.target.result);
      if (!root) {
        root = newRoot; currentFolder = root;
        collapsed.clear();
        walkAll(root, (n) => { if (n.type === 'folder') collapsed.add(n.id); });
        folderSortStates = {};
        renderTree(); renderList();
        setStatus('已导入 ' + countBookmarks(root) + ' 个书签');
      } else {
        showModal('导入方式', `<p>当前已有书签。选择处理方式：</p>`, [
          { label: '取消', action: closeModal },
          { label: '替换现有', action: () => {
              root = newRoot; currentFolder = root;
              selectedIds.clear(); collapsed.clear();
              walkAll(root, (n) => { if (n.type === 'folder') collapsed.add(n.id); });
              searchQuery = ''; document.getElementById('searchBox').value = '';
              folderSortStates = {};
              closeModal(); renderTree(); renderList();
              setStatus('已替换，共 ' + countBookmarks(root) + ' 个书签');
            }},
          { label: '合并（追加到根）', primary: true, action: () => {
              for (const c of newRoot.children) root.children.push(c);
              closeModal(); renderTree(); renderList();
              setStatus('已合并，共 ' + countBookmarks(root) + ' 个书签');
            }},
        ]);
      }
    } catch (err) { alert('解析失败：' + err.message); }
  };
  reader.readAsText(file, 'utf-8');
}

document.getElementById('btnDelete').onclick = deleteSelected;

document.getElementById('btnRename').onclick = openRenameDialog;

document.getElementById('btnFoldAll').onclick = () => collapseAll(true);
document.getElementById('btnUnfoldAll').onclick = () => collapseAll(false);

document.getElementById('btnSelectAll').onclick = () => {
  const items = searchQuery ? currentSearchResults : getVisibleItems();
  const allSel = items.length > 0 && items.every(i => selectedIds.has(i.id));
  if (allSel) selectedIds.clear();
  else items.forEach(i => selectedIds.add(i.id));
  if (searchQuery) doSearch(searchQuery); else renderList();
};
document.getElementById('searchBox').oninput = (e) => doSearch(e.target.value);

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Delete') deleteSelected();
  if (e.key === 'F2') {
    e.preventDefault();
    let targetNode = null;
    if (selectedIds.size === 1) {
      const r = findById([...selectedIds][0]);
      if (r) targetNode = r.node;
    } else if (currentFolder && currentFolder !== root) {
      targetNode = currentFolder;
    }
    if (targetNode) beginInlineEdit(targetNode);
    return;
  }
  if (e.ctrlKey && e.key === 'a') {
    e.preventDefault();
    (searchQuery ? currentSearchResults : getVisibleItems()).forEach(i => selectedIds.add(i.id));
    if (searchQuery) doSearch(searchQuery); else renderList();
  }
  if (e.key === 'Escape') { hideContextMenu(); closeModal(); }
});

document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => {
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    e.preventDefault();
    importFile(e.dataTransfer.files[0]);
  }
});
