<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>书签管理器 Pro v1.7.1</title>
<!-- 书签管理器 Pro v1.7.1 | 2026-10-15 -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1e1e2e; --panel: #27293d; --panel2: #2f3147;
    --border: #3a3d5c; --text: #e0e0e0; --muted: #888;
    --accent: #7aa2f7; --accent2: #bb9af7; --danger: #f7768e;
    --ok: #9ece6a; --warn: #e0af68;
  }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
  }
  .toolbar {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar .group { display: flex; gap: 4px; align-items: center;
    padding-right: 8px; border-right: 1px solid var(--border); }
  .toolbar .group:last-child { border-right: none; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;
    transition: .15s; white-space: nowrap;
  }
  button:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:active { transform: scale(.97); }
  button.danger:hover { background: var(--danger); border-color: var(--danger); }
  button.primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  button.primary:hover { filter: brightness(1.1); }
  input[type=text], input[type=search], input[type=number], select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 5px 8px; border-radius: 5px; font-size: 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .main { flex: 1; display: flex; overflow: hidden; }

  /* 侧边栏：宽度由 JS 控制，右侧有一条可拖拽的分隔条 */
  .sidebar {
    width: 280px; min-width: 180px; max-width: 600px;
    background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
    flex-shrink: 0;
  }
  .sidebar-header {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header .left { display: flex; align-items: center; gap: 6px; }
  .sidebar-header .count { color: var(--muted); font-weight: 400; font-size: 11px; }
  .fold-btn {
    background: transparent; border: 1px solid var(--border); padding: 1px 6px;
    font-size: 11px; border-radius: 4px; color: var(--muted);
  }
  .fold-btn:hover { background: var(--accent); color: #fff; }
  .tree { flex: 1; overflow-y: auto; padding: 6px; }
  .tree-node { user-select: none; }
  .tree-row {
    display: flex; align-items: center; gap: 4px; padding: 5px 6px;
    border-radius: 4px; cursor: pointer; white-space: nowrap;
    position: relative;
  }
  .tree-row:hover { background: var(--panel2); }
  .tree-row.active { background: var(--accent); color: #fff; }
  .tree-row.drop-target { background: var(--accent2); color: #fff; }
  .tree-row.drop-before { box-shadow: inset 0 2px 0 0 var(--accent); }
  .tree-row.drop-after  { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .tree-row .arrow { width: 14px; text-align: center; color: var(--muted); font-size: 10px; }
  .tree-row.active .arrow { color: #ddd; }
  .tree-row .icon { width: 16px; text-align: center; }
  .tree-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 2px; }
  .tree-row .count { color: var(--muted); font-size: 11px; }
  .tree-row.active .count { color: #ddd; }
  .tree-children { margin-left: 14px; }

  /* 侧边栏拖拽分隔线（唯一一条，紧贴 sidebar 右侧） */
  #sidebarSplitter {
    width: 6px; cursor: col-resize; flex-shrink: 0;
    background: var(--bg); position: relative;
  }
  #sidebarSplitter::after {
    content: ''; position: absolute; left: 2.5px; top: 0; bottom: 0;
    width: 1px; background: var(--border);
  }
  #sidebarSplitter:hover::after, #sidebarSplitter.dragging::after {
    background: var(--accent); width: 2px; left: 2px;
  }
  body.sidebar-resizing { cursor: col-resize !important; }
  body.sidebar-resizing * { cursor: col-resize !important; user-select: none !important; }

  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .content-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; background: var(--panel);
  }
  .content-header h2 { font-size: 14px; font-weight: 600; flex: 1; }
  /* 列表容器允许横向滚动 */
  .list-header-scroll {
    overflow-x: hidden; overflow-y: hidden;
    background: var(--panel2); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  .list-header {
    display: flex; align-items: stretch;
    font-size: 11px; color: var(--muted); user-select: none;
    height: 28px;
  }
  .list-header .col {
    display: flex; align-items: center; gap: 3px; cursor: pointer;
    padding: 0 4px; overflow: hidden; white-space: nowrap;
    position: relative; flex-shrink: 0;
  }
  .list-header .col .col-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .list-header .col:hover { background: var(--border); color: var(--text); }
  .list-header .col.fav-col { cursor: default; justify-content: center; padding: 0; }
  .list-header .col.fav-col:hover { background: transparent; color: var(--muted); }
  .splitter {
    width: 5px; cursor: col-resize; flex-shrink: 0;
    background: transparent; position: relative;
  }
  .splitter::after {
    content: ''; position: absolute; left: 2px; top: 4px; bottom: 4px;
    width: 1px; background: var(--border);
  }
  .splitter:hover::after, .splitter.dragging::after {
    background: var(--accent); width: 2px; left: 1.5px;
  }
  body.col-resizing { cursor: col-resize !important; }
  body.col-resizing * { cursor: col-resize !important; user-select: none !important; }

  /* 列表：主区，允许横向滚动 */
  .list {
    flex: 1; overflow: auto; padding: 0; position: relative;
  }
  .list-inner { display: inline-block; min-width: 100%; vertical-align: top; }
  .list-item {
    display: flex; align-items: center;
    padding: 3px 0; cursor: pointer; user-select: none;
    width: max-content; min-width: 100%;
  }
  .list-item:hover { background: var(--panel2); }
  /* 关键：高亮只覆盖到列尾。用内部一个包裹层控制高亮宽度 */
  .list-item > .row-inner {
    display: flex; align-items: center;
    padding: 0;
  }
  .list-item.selected > .row-inner { background: var(--accent); color: #fff; }
  .list-item > .row-inner > span, .list-item > .row-inner > img { flex-shrink: 0; padding: 0 3px; }
  .list-item .favicon { width: 16px; height: 16px; flex-shrink: 0; margin: 0 3px; display: inline-flex; align-items: center; justify-content: center; }
  .list-item .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 2px; }
  .list-item .title .title-icon { flex: 0 0 auto; }
  .list-item .title .title-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item .url { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item.selected .url { color: #e0e0e0; }
  .list-item .status { text-align: center; font-size: 11px; border-radius: 8px; padding: 0 5px; }
  .list-item.selected .status { background: rgba(255,255,255,.2) !important; color: #fff !important; }
  .status.ok { background: rgba(158,206,106,.2); color: var(--ok); }
  .status.bad { background: rgba(247,118,142,.2); color: var(--danger); }
  .status.pending { background: rgba(224,175,104,.2); color: var(--warn); }
  .list-item .tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--panel2); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-item.selected .tag { background: rgba(255,255,255,.2); color: #fff; }
  .list-item.drop-before > .row-inner { box-shadow: inset 0 2px 0 0 var(--accent); }
  .list-item.drop-after  > .row-inner { box-shadow: inset 0 -2px 0 0 var(--accent); }
  .list-item.drop-into   > .row-inner { background: var(--accent2); color: #fff; }
  .dragging { opacity: .4; }

  .inline-edit {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--accent); border-radius: 3px;
    padding: 1px 4px; font: inherit; outline: none;
  }

  .marquee {
    position: fixed; border: 1px solid var(--accent);
    background: rgba(122,162,247,.15); pointer-events: none; z-index: 999;
    display: none;
  }

  .ctx-menu {
    position: fixed; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px; z-index: 1000; min-width: 160px;
    box-shadow: 0 6px 20px rgba(0,0,0,.4); display: none;
  }
  .ctx-menu button {
    display: block; width: 100%; text-align: left; background: none;
    border: none; padding: 6px 10px; border-radius: 4px;
  }
  .ctx-menu button:hover { background: var(--accent); }
  .ctx-menu .sep { height: 1px; background: var(--border); margin: 4px 0; }

  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 2000;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; min-width: 480px; max-width: 96vw; max-height: 92vh;
    overflow: hidden; display: flex; flex-direction: column;
    position: relative; resize: both;
  }
  .modal h3 { margin-bottom: 12px; font-size: 15px; flex-shrink: 0; }
  .modal .modal-body { flex: 1; overflow: auto; display: flex; flex-direction: column; }
  .modal label { display: block; margin: 8px 0 4px; font-size: 12px; color: var(--muted); }
  .modal input[type=text], .modal input[type=number], .modal select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); padding: 7px 9px; border-radius: 5px;
    font-size: 13px; font-family: inherit; outline: none;
  }
  .modal input[type=checkbox] { width: auto; }
  .modal code { background: var(--bg); padding: 1px 5px; border-radius: 3px; color: var(--accent2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-shrink: 0; }
  /* 拉伸小手柄 */
  .modal-resize-hint {
    position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px;
    pointer-events: none;
    background:
      linear-gradient(135deg, transparent 0 50%, var(--muted) 50% 55%, transparent 55% 65%, var(--muted) 65% 70%, transparent 70%);
    opacity: .6;
  }

  /* Tab 栏 */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-shrink: 0; }
  .tab {
    padding: 7px 14px; cursor: pointer; font-size: 13px;
    border: 1px solid transparent; border-bottom: none;
    border-radius: 6px 6px 0 0; color: var(--muted);
    position: relative; top: 1px;
  }
  .tab:hover { background: var(--panel2); color: var(--text); }
  .tab.active {
    background: var(--bg); color: var(--text);
    border-color: var(--border);
    border-bottom-color: var(--bg);
  }
  .tab .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok); margin-left: 6px; vertical-align: middle;
  }
  .tab-panel { flex-shrink: 0; overflow: auto; padding-right: 4px; }
  .tab-panel.hidden { display: none; }
  .panel-row { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
  .panel-row > div { flex: 1; }
  .panel-row .small { flex: 0 0 90px; }
  .enable-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--bg); border-radius: 6px;
    margin-bottom: 10px;
  }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.7; margin-top: 10px; }
  .hint code { background: #11111b; }

  /* 预览表（Windows 逻辑：可横向滚动、列宽可拖、行高亮只到列尾） */
  .preview-wrap {
    border: 1px solid var(--border); border-radius: 6px;
    overflow: auto; margin-top: 12px; flex: 1; min-height: 120px;
    background: var(--bg); position: relative;
  }
  .preview-inner { display: inline-block; min-width: 100%; vertical-align: top; }
  .preview-header {
    display: flex; align-items: stretch; position: sticky; top: 0;
    background: var(--panel2); color: var(--muted); z-index: 1;
    border-bottom: 1px solid var(--border); height: 26px;
  }
  .preview-header .pcol {
    display: flex; align-items: center; padding: 0 6px;
    overflow: hidden; white-space: nowrap; flex-shrink: 0;
    font-size: 11px; cursor: pointer;
  }
  .preview-header .pcol.chk-col { justify-content: center; cursor: default; }
  .preview-header .pcol:hover { background: var(--border); color: var(--text); }
  .preview-row {
    display: flex; align-items: center; font-size: 12px;
    width: max-content; min-width: 100%;
  }
  .preview-row:hover { background: var(--panel2); }
  .preview-row.disabled { opacity: .5; }
  .preview-row > .row-inner { display: flex; align-items: center; }
  .preview-row .pcol {
    padding: 4px 6px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex-shrink: 0;
  }
  .preview-row .pcol.chk-col { text-align: center; }
  .preview-row .pcol.old { color: var(--muted); }
  .preview-row .pcol.arrow { text-align: center; color: var(--muted); }
  .preview-row .pcol.new { color: var(--ok); font-weight: 500; }
  .preview-row.disabled .pcol.new { color: var(--muted); text-decoration: line-through; }

  .log-box {
    background: #11111b; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font-family: Consolas, "Courier New", monospace;
    font-size: 11.5px; line-height: 1.6; max-height: 380px; overflow: auto;
    white-space: pre-wrap; word-break: break-all; color: #cdd6f4;
  }

  .statusbar {
    padding: 4px 12px; background: var(--panel); border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); display: flex; justify-content: space-between;
  }
  .empty { text-align: center; color: var(--muted); padding: 40px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <button class="primary" id="btnImport">📂 导入书签</button>
    <button id="btnExport">💾 导出书签</button>
    <button id="btnExportSelected">💾 导出选中</button>
    <input type="file" id="fileInput" accept=".html,.htm" hidden>
  </div>
  <div class="group">
    <button id="btnNewFolder">📁 新建文件夹</button>
    <button id="btnNewBookmark">🔖 新增书签</button>
    <button id="btnDelete" class="danger">🗑 删除</button>
  </div>
  <div class="group">
    <button id="btnFindDup">🔍 查找重复</button>
    <button id="btnCheck">🔗 检测失效</button>
  </div>
  <div class="group">
    <button id="btnRename">✏️ 批量改名</button>
  </div>
  <div class="group" style="flex:1; border:none;">
    <input type="search" id="searchBox" placeholder="🔍 搜索标题或网址..." style="flex:1; min-width:150px;">
  </div>
  <div class="group" style="border:none; padding-right:0;">
    <button id="btnAbout">ℹ️ 关于</button>
    <span id="version" style="color:var(--muted); font-size:11px; padding-right:4px;">v1.7.0</span>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="left">
        <span>文件夹</span>
        <button class="fold-btn" id="btnFoldAll" title="全部折叠">⊟</button>
        <button class="fold-btn" id="btnUnfoldAll" title="全部展开">⊞</button>
      </div>
      <span id="totalCount" class="count"></span>
    </div>
    <div class="tree" id="tree"></div>
  </div>
  <div id="sidebarSplitter" title="拖动调整宽度"></div>
  <div class="content">
    <div class="content-header">
      <h2 id="folderTitle">未导入</h2>
      <span id="folderPath" style="color:var(--muted); font-size:11px;"></span>
      <button id="btnSelectAll" style="display:none;">全选</button>
    </div>
    <div class="list-header-scroll" id="listHeaderScroll">
      <div class="list-header" id="listHeader"></div>
    </div>
    <div class="list" id="list"><div class="list-inner" id="listInner"></div></div>
  </div>
</div>

<div class="statusbar">
  <span id="status">就绪。点击「导入书签」开始。</span>
  <span id="selectionInfo"></span>
</div>

<div class="marquee" id="marquee"></div>
<div class="ctx-menu" id="ctxMenu"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* ============================================================
 *  版本
 * ============================================================ */
const APP_VERSION = '1.7.1';

/* ============================================================
 *  数据模型
 * ============================================================ */
let root = null;
let currentFolder = null;
let selectedIds = new Set();
let searchQuery = '';
let uidCounter = 0;
let editingId = null;
const uid = () => 'n' + (++uidCounter) + '_' + Date.now().toString(36);

let sortState = { key: null, dir: 1 };

const DEFAULT_COLS = {
  '__fav': 22,
  'title': 260,
  'url': 360,
  'status': 64,
};
let colWidths = loadColWidths();

function loadColWidths() {
  try {
    const s = localStorage.getItem('bm_col_widths_v3');
    if (s) return Object.assign({}, DEFAULT_COLS, JSON.parse(s));
  } catch (e) {}
  return Object.assign({}, DEFAULT_COLS);
}
function saveColWidths() {
  try { localStorage.setItem('bm_col_widths_v3', JSON.stringify(colWidths)); } catch (e) {}
}

// 侧边栏宽度
const SIDEBAR_DEFAULT = 280;
const SIDEBAR_MIN = 180;
const SIDEBAR_MAX = 600;
const SIDEBAR_SNAP = 12; // 磁吸判定像素
let sidebarWidth = loadSidebarWidth();
function loadSidebarWidth() {
  const v = parseInt(localStorage.getItem('bm_sidebar_width'), 10);
  if (!isNaN(v) && v >= SIDEBAR_MIN && v <= SIDEBAR_MAX) return v;
  return SIDEBAR_DEFAULT;
}
function saveSidebarWidth(w) {
  try { localStorage.setItem('bm_sidebar_width', String(w)); } catch (e) {}
}

function newFolder(title, children = []) {
  return { id: uid(), type: 'folder', title, children, addDate: Date.now(), lastModified: Date.now() };
}
function newBookmark(title, url, extra = {}) {
  return { id: uid(), type: 'bookmark', title, url, addDate: Date.now(), ...extra };
}

/* ============================================================
 *  解析 / 导出
 * ============================================================ */
function parseBookmarks(html) {
  const parser = new DOMParser();
  let cleanHtml = html.replace(/<!DOCTYPE[^>]*>/gi, '');
  let doc;
  try { doc = parser.parseFromString(cleanHtml, 'text/html'); }
  catch (e) { doc = parser.parseFromString('<html><body>' + cleanHtml + '</body></html>', 'text/html'); }
  const firstDl = doc.querySelector('dl');
  if (!firstDl) throw new Error('未找到 <DL> 结构，可能不是 Chrome 书签文件');
  const rootFolder = newFolder('书签栏');
  rootFolder.children = parseDl(firstDl);
  return rootFolder;
}
function parseDl(dl) {
  const items = [];
  for (const child of dl.children) {
    if (child.tagName !== 'DT') continue;
    const h3 = child.querySelector(':scope > h3');
    const a = child.querySelector(':scope > a');
    if (h3) {
      const folder = newFolder(cleanText(h3.textContent));
      let next = child.nextElementSibling;
      let subDl = child.querySelector(':scope > dl') || (next && next.tagName === 'DL' ? next : null);
      if (subDl) folder.children = parseDl(subDl);
      items.push(folder);
    } else if (a) {
      items.push(newBookmark(cleanText(a.textContent), a.getAttribute('HREF') || '', {
        icon: a.getAttribute('ICON') || '',
        iconUri: a.getAttribute('ICON_URI') || '',
      }));
    }
  }
  return items;
}
function cleanText(t) { return (t || '').replace(/\s+/g, ' ').trim(); }

function exportBookmarks() {
  if (!root) { alert('还没有导入书签'); return; }
  const lines = [];
  lines.push('<!DOCTYPE NETSCAPE-Bookmark-file-1>');
  lines.push('<!-- This is an automatically generated file.');
  lines.push('     It will be read and overwritten.');
  lines.push('     DO NOT EDIT! -->');
  lines.push('<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">');
  lines.push('<TITLE>Bookmarks</TITLE>');
  lines.push('<H1>Bookmarks</H1>');
  lines.push('<DL><p>');
  for (const child of root.children) lines.push(...nodeToLines(child, 1));
  lines.push('</DL><p>');
  downloadHtml(lines.join('\n'), `bookmarks_${new Date().toISOString().slice(0,10)}.html`);
  setStatus('已导出全部书签');
}

function exportSelected() {
  if (!root) { alert('还没有导入书签'); return; }
  if (!selectedIds.size) { alert('请先选中要导出的项'); return; }
  const virtualRoot = newFolder(root.title, []);
  const memo = new Map();

  function ensureFolderChain(folderNode) {
    if (folderNode === root) return virtualRoot;
    if (memo.has(folderNode.id)) return memo.get(folderNode.id);
    const r = findById(folderNode.id);
    const parentVirtual = r && r.parent ? ensureFolderChain(r.parent) : virtualRoot;
    const v = newFolder(folderNode.title, []);
    parentVirtual.children.push(v);
    memo.set(folderNode.id, v);
    return v;
  }

  const ordered = [];
  walkAll(root, (n) => { if (selectedIds.has(n.id)) ordered.push(n); });

  for (const n of ordered) {
    if (n === root) continue;
    const r = findById(n.id);
    if (!r || !r.parent) continue;
    if (n.type === 'bookmark') {
      const parentVirtual = ensureFolderChain(r.parent);
      parentVirtual.children.push({ ...n });
    } else {
      const parentVirtual = ensureFolderChain(r.parent);
      const v = newFolder(n.title, deepCloneChildren(n));
      parentVirtual.children.push(v);
      memo.set(n.id, v);
    }
  }

  const lines = [];
  lines.push('<!DOCTYPE NETSCAPE-Bookmark-file-1>');
  lines.push('<!-- This is an automatically generated file.');
  lines.push('     It will be read and overwritten.');
  lines.push('     DO NOT EDIT! -->');
  lines.push('<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">');
  lines.push('<TITLE>Bookmarks</TITLE>');
  lines.push('<H1>Bookmarks</H1>');
  lines.push('<DL><p>');
  for (const child of virtualRoot.children) lines.push(...nodeToLines(child, 1));
  lines.push('</DL><p>');
  downloadHtml(lines.join('\n'), `bookmarks_selected_${new Date().toISOString().slice(0,10)}.html`);
  setStatus('已导出 ' + selectedIds.size + ' 个选中项');
}

function deepCloneChildren(node) {
  if (node.type === 'bookmark') return [];
  return node.children.map(c => {
    if (c.type === 'bookmark') return { ...c };
    return newFolder(c.title, deepCloneChildren(c));
  });
}

function downloadHtml(html, filename) {
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function nodeToLines(node, depth) {
  const pad = '    '.repeat(depth);
  if (node.type === 'folder') {
    const out = [];
    out.push(`${pad}<DT><H3>${esc(node.title)}</H3>`);
    out.push(`${pad}<DL><p>`);
    for (const c of node.children) out.push(...nodeToLines(c, depth + 1));
    out.push(`${pad}</DL><p>`);
    return out;
  }
  const attrs = [`HREF="${escAttr(node.url)}"`];
  if (node.icon) attrs.push(`ICON="${escAttr(node.icon)}"`);
  if (node.iconUri) attrs.push(`ICON_URI="${escAttr(node.iconUri)}"`);
  return [`${pad}<DT><A ${attrs.join(' ')}>${esc(node.title)}</A>`];
}
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }

/* ============================================================
 *  遍历 / 工具
 * ============================================================ */
function walkAll(node, cb, parent = null) {
  cb(node, parent);
  if (node.type === 'folder') for (const c of node.children) walkAll(c, cb, node);
}
function findById(id, node = root, parent = null) {
  if (!node) return null;
  if (node.id === id) return { node, parent };
  if (node.type === 'folder') {
    for (const c of node.children) {
      const r = findById(id, c, node);
      if (r) return r;
    }
  }
  return null;
}
function findParentFolderOf(id) { const r = findById(id); return r ? r.parent : null; }
function countBookmarks(node) {
  if (node.type === 'bookmark') return 1;
  return node.children.reduce((s, c) => s + countBookmarks(c), 0);
}
function countAll(node) {
  if (node.type === 'bookmark') return 1;
  return 1 + node.children.reduce((s, c) => s + countAll(c), 0);
}
function folderPath(node) {
  const path = [];
  (function find(n, target, acc) {
    if (n === target) { path.push(...acc, n.title); return true; }
    if (n.type === 'folder') {
      for (const c of n.children) if (find(c, target, [...acc, n.title])) return true;
    }
    return false;
  })(root, node, []);
  return path.join(' / ');
}
function isDescendant(ancestor, node) {
  if (ancestor === node) return false;
  if (ancestor.type !== 'folder') return false;
  for (const c of ancestor.children) {
    if (c === node || isDescendant(c, node)) return true;
  }
  return false;
}

/* ============================================================
 *  内联重命名
 * ============================================================ */
function beginInlineEdit(node) {
  editingId = node.id;
  renderTree(); renderList();
  requestAnimationFrame(() => {
    const input = document.querySelector('.inline-edit');
    if (input) { input.focus(); input.select(); }
  });
}
function commitInlineEdit(node, value) {
  if (editingId !== node.id) return;
  editingId = null;
  const v = (value || '').trim();
  if (v) node.title = v;
  renderTree(); renderList();
  if (searchQuery) doSearch(searchQuery);
  setStatus('已重命名');
}
function cancelInlineEdit() {
  editingId = null;
  renderTree(); renderList();
}
function makeInlineInput(node) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'inline-edit';
  input.value = node.title || '';
  input.onkeydown = (ev) => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); commitInlineEdit(node, input.value); }
    else if (ev.key === 'Escape') { ev.preventDefault(); cancelInlineEdit(); }
  };
  input.onblur = () => commitInlineEdit(node, input.value);
  input.onclick = (ev) => ev.stopPropagation();
  input.ondblclick = (ev) => ev.stopPropagation();
  return input;
}

/* ============================================================
 *  树渲染
 *  交互：单击文件夹 = 高亮 + 切右侧 + 展开（若收起）
 *        再次单击同一文件夹 = 高亮 + 切右侧（不收）
 *        单击箭头 = 只展开/收起
 *        双击文件夹 = 高亮 + 切右侧（与单击等效，不再做额外事）
 * ============================================================ */
const collapsed = new Set();

function renderTree() {
  const treeEl = document.getElementById('tree');
  treeEl.innerHTML = '';
  if (!root) {
    treeEl.innerHTML = '<div class="empty">尚未导入书签</div>';
    document.getElementById('totalCount').textContent = '';
    return;
  }
  const rootRow = document.createElement('div');
  rootRow.className = 'tree-row';
  if (currentFolder === root) rootRow.classList.add('active');
  rootRow.innerHTML = `<span class="arrow">▼</span><span class="icon">📁</span><span class="name">${esc(root.title)}</span><span class="count">${countBookmarks(root)}</span>`;
  rootRow.onclick = () => {
    currentFolder = root;
    selectedIds.clear();
    sortState = { key: null, dir: 1 };
    renderTree(); renderList();
  };
  rootRow.ondragover = (e) => {
    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    clearTreeIndicator();
    rootRow.classList.add('drop-target');
  };
  rootRow.ondrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    clearTreeIndicator();
    dropIntoFolder(getDragIds(e), root.id);
  };
  treeEl.appendChild(rootRow);

  const container = document.createElement('div');
  container.className = 'tree-children';
  for (const child of root.children) {
    if (child.type === 'folder') container.appendChild(renderFolderNode(child));
  }
  treeEl.appendChild(container);

  document.getElementById('totalCount').textContent =
    countAll(root) + ' 项 / ' + countBookmarks(root) + ' 书签';
}

function renderFolderNode(node) {
  const wrap = document.createElement('div');
  wrap.className = 'tree-node';

  const row = document.createElement('div');
  row.className = 'tree-row';
  if (currentFolder === node) row.classList.add('active');
  row.dataset.id = node.id;

  const hasChildren = node.children.length > 0;
  const isCollapsed = collapsed.has(node.id);

  const arrow = document.createElement('span');
  arrow.className = 'arrow';
  arrow.textContent = hasChildren ? (isCollapsed ? '▶' : '▼') : '';
  arrow.onclick = (e) => {
    e.stopPropagation();
    if (collapsed.has(node.id)) collapsed.delete(node.id);
    else collapsed.add(node.id);
    renderTree();
  };
  row.appendChild(arrow);

  const icon = document.createElement('span');
  icon.className = 'icon'; icon.textContent = '📁';
  row.appendChild(icon);

  const name = document.createElement('span');
  name.className = 'name';
  if (editingId === node.id) name.appendChild(makeInlineInput(node));
  else name.textContent = node.title || '(未命名)';
  row.appendChild(name);

  const count = document.createElement('span');
  count.className = 'count';
  count.textContent = countBookmarks(node);
  row.appendChild(count);

  // 单击：高亮 + 切右侧 + 展开（若收起）
  row.onclick = (e) => {
    if (editingId === node.id) return;
    currentFolder = node;
    selectedIds.clear();
    sortState = { key: null, dir: 1 };
    // 若收起 → 展开；若已展开 → 保持不动（不收）
    if (collapsed.has(node.id)) collapsed.delete(node.id);
    renderTree(); renderList();
  };

  row.ondblclick = (e) => {
    // 双击当作"进入"——跟单击等效，只是把右键菜单可能触发的单击也一并走一次
    e.preventDefault();
  };

  row.draggable = editingId !== node.id;
  row.ondragstart = (e) => { startDrag(e, node.id); e.dataTransfer.effectAllowed = 'move'; };
  row.ondragend = clearDragStyles;

  row.ondragover = (e) => {
    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = 'move';
    const rect = row.getBoundingClientRect();
    const rel = (e.clientY - rect.top) / rect.height;
    clearTreeIndicator();
    if (rel < 0.25) row.classList.add('drop-before');
    else if (rel > 0.75) row.classList.add('drop-after');
    else row.classList.add('drop-target');
  };
  row.ondrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    const rect = row.getBoundingClientRect();
    const rel = (e.clientY - rect.top) / rect.height;
    clearTreeIndicator();
    const ids = getDragIds(e);
    if (rel < 0.25) dropSibling(ids, node, 'before');
    else if (rel > 0.75) dropSibling(ids, node, 'after');
    else dropIntoFolder(ids, node.id);
  };

  row.oncontextmenu = (e) => {
    e.preventDefault();
    currentFolder = node;
    showContextMenu(e.clientX, e.clientY, node);
  };

  wrap.appendChild(row);

  if (!isCollapsed && node.children.length) {
    const childContainer = document.createElement('div');
    childContainer.className = 'tree-children';
    for (const c of node.children) {
      if (c.type === 'folder') childContainer.appendChild(renderFolderNode(c));
    }
    if (childContainer.children.length) wrap.appendChild(childContainer);
  }
  return wrap;
}

function clearTreeIndicator() {
  document.querySelectorAll('.tree-row.drop-before, .tree-row.drop-after, .tree-row.drop-target')
    .forEach(el => el.classList.remove('drop-before', 'drop-after', 'drop-target'));
}

function collapseAll(collapse) {
  if (!root) return;
  if (collapse) {
    walkAll(root, (n) => { if (n.type === 'folder' && n !== root) collapsed.add(n.id); });
  } else {
    collapsed.clear();
  }
  renderTree();
}

/* ============================================================
 *  侧边栏拖动
 * ============================================================ */
function setupSidebarSplitter() {
  const sb = document.getElementById('sidebar');
  const sp = document.getElementById('sidebarSplitter');
  sb.style.width = sidebarWidth + 'px';

  sp.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX;
    const startW = sb.getBoundingClientRect().width;
    sp.classList.add('dragging');
    document.body.classList.add('sidebar-resizing');

    const onMove = (ev) => {
      let w = startW + (ev.clientX - startX);
      // 磁吸
      if (Math.abs(w - SIDEBAR_DEFAULT) <= SIDEBAR_SNAP) w = SIDEBAR_DEFAULT;
      if (w < SIDEBAR_MIN) w = SIDEBAR_MIN;
      if (w > SIDEBAR_MAX) w = SIDEBAR_MAX;
      sb.style.width = w + 'px';
      sidebarWidth = w;
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      sp.classList.remove('dragging');
      document.body.classList.remove('sidebar-resizing');
      saveSidebarWidth(Math.round(sb.getBoundingClientRect().width));
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // 双击恢复默认
  sp.addEventListener('dblclick', () => {
    sb.style.width = SIDEBAR_DEFAULT + 'px';
    sidebarWidth = SIDEBAR_DEFAULT;
    saveSidebarWidth(SIDEBAR_DEFAULT);
  });
}

/* ============================================================
 *  拖拽（多选）
 * ============================================================ */
let dragIds = [];

function startDrag(e, primaryId) {
  if (selectedIds.has(primaryId) && selectedIds.size > 1) {
    dragIds = [...selectedIds];
  } else {
    dragIds = [primaryId];
    selectedIds.clear();
    selectedIds.add(primaryId);
    document.querySelectorAll('.list-item.selected').forEach(el => el.classList.remove('selected'));
    document.querySelectorAll('.tree-row.active').forEach(el => el.classList.remove('active'));
    const el = document.querySelector(`.list-item[data-id="${primaryId}"]`);
    if (el) el.classList.add('selected');
    updateSelectionInfo();
  }
  e.dataTransfer.setData('text/plain', primaryId);
  e.dataTransfer.setData('application/x-bm-ids', JSON.stringify(dragIds));
  dragIds.forEach(id => {
    const el = document.querySelector(`.list-item[data-id="${id}"], .tree-row[data-id="${id}"]`);
    if (el) el.classList.add('dragging');
  });
  return dragIds;
}
function getDragIds(e) {
  try {
    const s = e.dataTransfer.getData('application/x-bm-ids');
    if (s) return JSON.parse(s);
  } catch (_) {}
  const t = e.dataTransfer.getData('text/plain');
  return t ? [t] : [];
}
function clearDragStyles() {
  dragIds = [];
  document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drop-target, .drop-before, .drop-after, .drop-into')
    .forEach(el => el.classList.remove('drop-target', 'drop-before', 'drop-after', 'drop-into'));
}

/* ============================================================
 *  放置逻辑
 * ============================================================ */
function dropIntoFolder(ids, targetFolderId) {
  const tgt = findById(targetFolderId);
  if (!tgt || tgt.node.type !== 'folder') return;
  const items = collectMovable(ids, tgt.node);
  if (!items.length) return;
  for (const r of items) {
    if (r.parent) r.parent.children = r.parent.children.filter(c => c.id !== r.node.id);
  }
  for (const r of items) tgt.node.children.push(r.node);
  renderTree(); renderList();
  if (searchQuery) doSearch(searchQuery);
  setStatus(`已移动 ${items.length} 项到「${tgt.node.title}」`);
}

function dropSibling(ids, refNode, position) {
  const r = findById(refNode.id);
  if (!r || !r.parent) return;
  const parent = r.parent;
  const items = collectMovable(ids, parent, refNode);
  if (!items.length) return;

  const refIdx = parent.children.findIndex(c => c.id === refNode.id);
  const beforeId = position === 'before'
    ? refNode.id
    : (parent.children[refIdx + 1] ? parent.children[refIdx + 1].id : null);

  for (const it of items) {
    if (it.parent) it.parent.children = it.parent.children.filter(c => c.id !== it.node.id);
  }
  let idx = beforeId ? parent.children.findIndex(c => c.id === beforeId) : parent.children.length;
  if (idx === -1) idx = parent.children.length;
  parent.children.splice(idx, 0, ...items.map(i => i.node));

  renderTree(); renderList();
  if (searchQuery) doSearch(searchQuery);
  setStatus(`已移动 ${items.length} 项`);
}

function collectMovable(ids, filterSelf = null, excludeRef = null) {
  const items = [];
  const seen = new Set();
  for (const id of ids) {
    if (seen.has(id)) continue;
    seen.add(id);
    if (filterSelf && id === filterSelf.id) continue;
    if (excludeRef && id === excludeRef.id) continue;
    const r = findById(id);
    if (!r || r.node === root) continue;
    if (filterSelf && isDescendant(r.node, filterSelf)) continue;
    if (filterSelf && r.node === filterSelf) continue;
    items.push(r);
  }
  return items;
}

/* ============================================================
 *  列表栏（表头）+ splitter（横向滚动 + 列宽可拖）
 * ============================================================ */
const COLUMNS = [
  { key: '__fav',  label: '',     sortable: false },
  { key: 'title',  label: '标题', sortable: true  },
  { key: 'url',    label: '网址', sortable: true  },
  { key: 'status', label: '状态', sortable: true  },
  { key: 'tag',    label: '位置', sortable: true,  onlySearch: true },
];

function visibleColumns() {
  const isSearch = !!searchQuery;
  return COLUMNS.filter(c => {
    if (c.onlySearch && !isSearch) return false;
    return true;
  });
}

function renderListHeader() {
  const el = document.getElementById('listHeader');
  if (!root || (!currentFolder && !searchQuery)) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = '';
  const cols = visibleColumns();
  let totalWidth = 0;
  cols.forEach((col) => {
    const w = colWidths[col.key] || DEFAULT_COLS[col.key] || 100;
    totalWidth += w + 5;

    const d = document.createElement('div');
    d.className = 'col' + (col.key === '__fav' ? ' fav-col' : '');
    d.style.width = w + 'px';
    d.dataset.key = col.key;

    const lbl = document.createElement('span');
    lbl.className = 'col-label';
    if (col.sortable && sortState.key === col.key) {
      lbl.textContent = col.label + (sortState.dir === 1 ? ' ▲' : ' ▼');
    } else {
      lbl.textContent = col.label;
    }
    d.appendChild(lbl);
    if (col.sortable) d.onclick = () => toggleSort(col.key);
    el.appendChild(d);

    const sp = document.createElement('div');
    sp.className = 'splitter';
    sp.dataset.leftKey = col.key;
    sp.onmousedown = (e) => beginColResize(e, col.key);
    sp.ondblclick = (e) => { e.preventDefault(); autoFitColumn(col.key); };
    el.appendChild(sp);
  });

  // 让表头和列表内容同宽（多出来的用 padding 吸收，不额外占 splitter）
  el.style.minWidth = totalWidth + 'px';
}

function beginColResize(e, key) {
  e.preventDefault();
  const startX = e.clientX;
  const startW = colWidths[key] || DEFAULT_COLS[key] || 100;
  const splitter = e.currentTarget;
  splitter.classList.add('dragging');
  document.body.classList.add('col-resizing');

  const onMove = (ev) => {
    const dx = ev.clientX - startX;
    let w = startW + dx;
    if (w < 24) w = 24;
    if (w > 1200) w = 1200;
    colWidths[key] = w;
    applyWidthToDom(key, w);
    // 让表头 min-width 重新计算
    recalcHeaderWidth();
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    splitter.classList.remove('dragging');
    document.body.classList.remove('col-resizing');
    saveColWidths();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function recalcHeaderWidth() {
  const el = document.getElementById('listHeader');
  if (!el) return;
  const cols = visibleColumns();
  let total = 0;
  cols.forEach(col => { total += (colWidths[col.key] || DEFAULT_COLS[col.key] || 100) + 5; });
  el.style.minWidth = total + 'px';
}

function applyWidthToDom(key, w) {
  document.querySelectorAll(`.list-header .col[data-key="${key}"]`).forEach(el => el.style.width = w + 'px');
  document.querySelectorAll(`.list-item .col[data-colkey="${key}"]`).forEach(el => el.style.width = w + 'px');
}

function autoFitColumn(key) {
  const samples = document.querySelectorAll(`.list-item .col[data-colkey="${key}"]`);
  let max = 40;
  samples.forEach(el => {
    const text = el.textContent || '';
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:13px "Segoe UI","Microsoft YaHei",sans-serif;';
    span.textContent = text;
    document.body.appendChild(span);
    const w = span.getBoundingClientRect().width + 16;
    document.body.removeChild(span);
    if (w > max) max = w;
  });
  max = Math.min(max, 800);
  colWidths[key] = max;
  saveColWidths();
  renderListHeader();
  applyWidthToDom(key, max);
  recalcHeaderWidth();
}

function toggleSort(key) {
  if (sortState.key === key) sortState.dir = -sortState.dir;
  else { sortState.key = key; sortState.dir = 1; }
  renderList();
}
function applySort(items) {
  if (!sortState.key) return items;
  const k = sortState.key, d = sortState.dir;
  const getVal = (it) => {
    switch (k) {
      case 'title': return (it.title || '').toLowerCase();
      case 'url': return (it.url || '').toLowerCase();
      case 'status': return it.linkStatus || '';
      case 'tag': { const p = findParentFolderOf(it.id); return (p ? p.title : '').toLowerCase(); }
      default: return '';
    }
  };
  return items.slice().sort((a, b) => {
    const va = getVal(a), vb = getVal(b);
    if (va < vb) return -1 * d;
    if (va > vb) return 1 * d;
    return 0;
  });
}

/* ============================================================
 *  列表渲染
 * ============================================================ */
function getVisibleItems() {
  if (!currentFolder) return [];
  let items = currentFolder.children.slice();
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    items = items.filter(it =>
      (it.title || '').toLowerCase().includes(q) ||
      (it.url || '').toLowerCase().includes(q));
  }
  return items;
}

function renderList() {
  const listInner = document.getElementById('listInner');
  const titleEl = document.getElementById('folderTitle');
  const pathEl = document.getElementById('folderPath');
  const selectAllBtn = document.getElementById('btnSelectAll');
  const isSearch = !!searchQuery;

  if (!currentFolder && !isSearch) {
    titleEl.textContent = '未导入';
    pathEl.textContent = '';
    listInner.innerHTML = '<div class="empty">点击「导入书签」开始</div>';
    selectAllBtn.style.display = 'none';
    renderListHeader();
    updateSelectionInfo();
    return;
  }

  let items = isSearch ? currentSearchResults.slice() : getVisibleItems();
  items = applySort(items);

  titleEl.textContent = isSearch
    ? `搜索结果：${items.length} 条`
    : (currentFolder ? (currentFolder.title || '(未命名)') : '');
  pathEl.textContent = isSearch
    ? `关键词 "${searchQuery}"`
    : (root && currentFolder ? folderPath(currentFolder) : '');
  selectAllBtn.style.display = 'inline-block';

  const allSelected = items.length > 0 && items.every(i => selectedIds.has(i.id));
  selectAllBtn.textContent = allSelected ? '全不选' : '全选';

  renderListHeader();

  listInner.innerHTML = '';
  if (!items.length) {
    listInner.innerHTML = '<div class="empty">' + (isSearch ? '没有匹配的书签' : '这个文件夹是空的') + '</div>';
    updateSelectionInfo();
    return;
  }

  const cols = visibleColumns();

  items.forEach((it, idx) => {
    const row = document.createElement('div');
    row.className = 'list-item';
    if (selectedIds.has(it.id)) row.classList.add('selected');
    row.dataset.id = it.id;

    // 高亮只覆盖到列尾 —— 用一个 row-inner 包住所有列，高亮打在这里
    const inner = document.createElement('div');
    inner.className = 'row-inner';

    cols.forEach(col => {
      const cell = document.createElement('span');
      cell.className = 'col';
      cell.dataset.colkey = col.key;
      const w = colWidths[col.key] || DEFAULT_COLS[col.key] || 100;
      cell.style.width = w + 'px';
      if (col.key === '__fav') {
        cell.classList.add('favicon');
        if (it.type === 'bookmark') {
          const img = document.createElement('img');
          img.src = it.iconUri || (it.url ? faviconUrl(it.url) : '');
          img.style.width = '16px'; img.style.height = '16px';
          img.onerror = () => { img.style.visibility = 'hidden'; };
          cell.appendChild(img);
        }
      } else if (col.key === 'title') {
        cell.classList.add('title');
        if (it.type === 'folder') {
          const icon = document.createElement('span');
          icon.className = 'title-icon';
          icon.textContent = '📁 ';
          cell.appendChild(icon);
        }
        if (editingId === it.id) {
          cell.appendChild(makeInlineInput(it));
        } else {
          const nameSpan = document.createElement('span');
          nameSpan.className = 'title-name';
          nameSpan.textContent = it.title || '(未命名)';
          cell.appendChild(nameSpan);
        }
      } else if (col.key === 'url') {
        cell.classList.add('url');
        cell.textContent = it.type === 'folder'
          ? `文件夹 · ${countBookmarks(it)} 个书签` : it.url;
      } else if (col.key === 'status') {
        cell.classList.add('status');
        if (it.type === 'bookmark' && it.linkStatus) {
          cell.classList.add(it.linkStatus);
          cell.textContent = it.linkStatus === 'ok' ? '可用' : it.linkStatus === 'bad' ? '失效' : '检查中';
        }
      } else if (col.key === 'tag') {
        cell.classList.add('tag');
        const p = findParentFolderOf(it.id);
        cell.textContent = p ? p.title : '';
      }
      inner.appendChild(cell);
    });

    row.appendChild(inner);

    row.onclick = (e) => {
      if (editingId === it.id) return;
      if (e.ctrlKey || e.metaKey) {
        if (selectedIds.has(it.id)) selectedIds.delete(it.id);
        else selectedIds.add(it.id);
      } else if (e.shiftKey && lastClickedIdx !== -1) {
        const [a, b] = [Math.min(lastClickedIdx, idx), Math.max(lastClickedIdx, idx)];
        for (let i = a; i <= b; i++) selectedIds.add(items[i].id);
      } else {
        selectedIds.clear();
        selectedIds.add(it.id);
      }
      lastClickedIdx = idx;
      renderList();
    };

    row.ondblclick = () => {
      if (it.type === 'bookmark') window.open(it.url, '_blank');
      else {
        currentFolder = it;
        selectedIds.clear();
        searchQuery = ''; document.getElementById('searchBox').value = '';
        sortState = { key: null, dir: 1 };
        renderTree(); renderList();
      }
    };

    row.oncontextmenu = (e) => {
      e.preventDefault();
      if (!selectedIds.has(it.id)) {
        selectedIds.clear(); selectedIds.add(it.id); renderList();
      }
      showContextMenu(e.clientX, e.clientY, it);
    };

    row.draggable = editingId !== it.id;
    row.ondragstart = (e) => { startDrag(e, it.id); e.dataTransfer.effectAllowed = 'move'; };
    row.ondragend = clearDragStyles;

    row.ondragover = (e) => {
      e.preventDefault(); e.stopPropagation();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const rel = (e.clientY - rect.top) / rect.height;
      clearListIndicator();
      if (it.type === 'folder') {
        if (rel < 0.25) row.classList.add('drop-before');
        else if (rel > 0.75) row.classList.add('drop-after');
        else row.classList.add('drop-into');
      } else {
        if (rel < 0.5) row.classList.add('drop-before');
        else row.classList.add('drop-after');
      }
    };
    row.ondrop = (e) => {
      e.preventDefault(); e.stopPropagation();
      const rect = row.getBoundingClientRect();
      const rel = (e.clientY - rect.top) / rect.height;
      const cls = row.classList.contains('drop-into') ? 'into'
                : row.classList.contains('drop-before') ? 'before'
                : row.classList.contains('drop-after') ? 'after' : null;
      clearListIndicator();
      const ids = getDragIds(e);
      if (cls === 'into' && it.type === 'folder') {
        dropIntoFolder(ids, it.id);
      } else {
        const before = (cls === 'before') || (cls === null && rel < 0.5);
        reorderMulti(ids, it.id, before);
      }
    };

    listInner.appendChild(row);
  });

  updateSelectionInfo();
}

function clearListIndicator() {
  document.querySelectorAll('.list-item.drop-before, .list-item.drop-after, .list-item.drop-into')
    .forEach(el => el.classList.remove('drop-before', 'drop-after', 'drop-into'));
}

let lastClickedIdx = -1;
function faviconUrl(url) {
  try { return 'https://www.google.com/s2/favicons?domain=' + new URL(url).hostname + '&sz=32'; }
  catch { return ''; }
}

function reorderMulti(ids, targetId, before) {
  if (sortState.key && currentFolder && !searchQuery) {
    currentFolder.children = applySort(currentFolder.children.slice());
    sortState = { key: null, dir: 1 };
    renderList();
  }
  const tgt = findById(targetId);
  if (!tgt) return;
  const targetParent = tgt.parent || root;
  const items = collectMovable(ids, targetParent, tgt.node);
  if (!items.length) return;

  const refIdx = targetParent.children.findIndex(c => c.id === targetId);
  const beforeId = before
    ? targetId
    : (targetParent.children[refIdx + 1] ? targetParent.children[refIdx + 1].id : null);

  for (const r of items) {
    if (r.parent) r.parent.children = r.parent.children.filter(c => c.id !== r.node.id);
  }
  let idx = beforeId ? targetParent.children.findIndex(c => c.id === beforeId) : targetParent.children.length;
  if (idx === -1) idx = targetParent.children.length;
  targetParent.children.splice(idx, 0, ...items.map(r => r.node));

  renderTree(); renderList();
  if (searchQuery) doSearch(searchQuery);
  setStatus(`已移动 ${items.length} 项`);
}

/* ============================================================
 *  删除 / 新建
 * ============================================================ */
function deleteSelected() {
  if (selectedIds.size) {
    if (!confirm('确定删除选中的 ' + selectedIds.size + ' 项？')) return;
    const ids = [...selectedIds];
    for (const id of ids) {
      const r = findById(id);
      if (r && r.parent && r.node !== root) r.parent.children = r.parent.children.filter(c => c.id !== id);
    }
    selectedIds.clear();
    renderTree(); renderList();
    if (searchQuery) doSearch(searchQuery);
    setStatus('已删除 ' + ids.length + ' 项');
    return;
  }
  if (currentFolder && currentFolder !== root) {
    if (!confirm('确定删除文件夹「' + currentFolder.title + '」及其中全部内容？')) return;
    const r = findById(currentFolder.id);
    if (!r || !r.parent) return;
    r.parent.children = r.parent.children.filter(c => c.id !== currentFolder.id);
    currentFolder = r.parent;
    renderTree(); renderList();
    setStatus('已删除文件夹');
    return;
  }
  setStatus('没有可删除的对象');
}

function createBookmark() {

/* ============================================================
 *  查找重复
 * ============================================================ */
function findDuplicates(scope) {
  const seen = new Map();
  const removed = [];
  function traverse(folder, pathArr) {
    for (const c of folder.children) {
      if (c.type === 'folder') { traverse(c, [...pathArr, c.title]); }
      else {
        const key = (c.url || '').trim().toLowerCase();
        if (!key) continue;
        if (seen.has(key)) {
          const first = seen.get(key);
          removed.push({
            node: c, parent: folder,
            title: c.title, url: c.url,
            path: [...pathArr, folder.title].join(' / '),
            keptTitle: first.node.title, keptPath: first.path,
          });
        } else {
          seen.set(key, { node: c, path: [...pathArr, folder.title].join(' / ') });
        }
      }
    }
  }
  traverse(scope, []);
  return removed;
}

function findDupDialog() {
  if (!root) return;
  const scope = currentFolder || root;
  const dups = findDuplicates(scope);

  if (!dups.length) {
    setStatus('没有发现重复书签');
    showModal('查找重复结果', `<p>范围：<b>${esc(scope.title)}</b></p><p style="color:var(--muted); margin-top:8px;">没有发现重复书签。</p>`);
    return;
  }

  const logLines = [
    `# 重复书签日志`,
    `# 生成时间: ${new Date().toLocaleString()}`,
    `# 工具版本: v${APP_VERSION}`,
    `# 范围: ${scope.title}`,
    `# 重复数: ${dups.length}`,
    '',
  ];
  dups.forEach((r, i) => {
    logLines.push(`[${i + 1}] 待删除`);
    logLines.push(`    标题: ${r.title}`);
    logLines.push(`    URL : ${r.url}`);
    logLines.push(`    原位置: ${r.path}`);
    logLines.push(`    保留项: ${r.keptTitle}`);
    logLines.push('');
  });
  const logText = logLines.join('\n');
  const escLog = logText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  setStatus(`发现 ${dups.length} 个重复书签，等待确认删除`);
  showModal(`发现 ${dups.length} 个重复书签`, `
    <p style="margin-bottom:10px;">范围：<b>${esc(scope.title)}</b>，将保留每个 URL 最早出现的一个。</p>
    <div class="log-box">${escLog}</div>
  `, [
    { label: '下载 .log', action: () => {
        const blob = new Blob([logText], { type: 'text/plain;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `duplicates_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.log`;
        a.click();
        URL.revokeObjectURL(a.href);
      }},
    { label: '取消', action: closeModal },
    { label: `确定删除 ${dups.length} 项重复`, primary: true, action: () => {
        for (const r of dups) {
          if (r.parent) r.parent.children = r.parent.children.filter(c => c.id !== r.node.id);
        }
        closeModal();
        renderTree(); renderList();
        if (searchQuery) doSearch(searchQuery);
        setStatus(`已删除 ${dups.length} 个重复书签`);
      }},
  ]);
}

/* ============================================================
 *  批量改名（Tab 式，仿拖把更名器）
 * ============================================================ */
const renameRule = {
  trim:     { enabled: false, head: '', headN: 1, tail: '', tailN: 1, caseSensitive: false, emptyIfNotFound: false },
  replace:  { enabled: false, find: '', repl: '', nth: '', caseSensitive: false },
  del:      { enabled: false, dir: 'head', start: 1, count: 1 },
  number:   { enabled: false, tpl: '#. <SELF>', start: 1, step: 1, pad: 1 },
  affix:    { enabled: false, prefix: '', suffix: '', atN: '' },
  regex:    { enabled: false, pattern: '', repl: '', target: 'title' },
};
const renameScope = { folders: true, bookmarks: true };
let renameActiveTab = 'trim';

function applyRuleTrim(text, r) {
  if (!text) return text;
  let start = 0, end = text.length;
  if (r.head) {
    const pos = findNth(text, r.head, r.headN, r.caseSensitive);
    if (pos === -1) return r.emptyIfNotFound ? '' : text;
    start = pos.idx;
  }
  if (r.tail) {
    const pos = findNth(text, r.tail, r.tailN, r.caseSensitive);
    if (pos === -1) return r.emptyIfNotFound ? '' : text;
    end = pos.idx + r.tail.length;
  }
  if (end < start) return text;
  return text.slice(start, end);
}
function findNth(text, needle, n, caseSensitive) {
  if (n < 1) n = 1;
  const t = caseSensitive ? text : text.toLowerCase();
  const nd = caseSensitive ? needle : needle.toLowerCase();
  let idx = -1, from = 0, count = 0;
  while (true) {
    idx = t.indexOf(nd, from);
    if (idx === -1) return -1;
    count++;
    if (count === n) return { idx };
    from = idx + 1;
  }
}
function applyRuleReplace(text, r) {
  if (!r.find) return text;
  const flags = 'g' + (r.caseSensitive ? '' : 'i');
  let re;
  try { re = new RegExp(escapeReg(r.find), flags); }
  catch (e) { return text; }
  if (r.nth) {
    const n = parseInt(r.nth, 10);
    if (!isNaN(n) && n > 0) {
      let i = 0;
      return text.replace(re, (m) => (++i === n ? (r.repl || '') : m));
    }
  }
  return text.replace(re, r.repl || '');
}
function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function applyRuleDel(text, r) {
  const start = parseInt(r.start, 10) || 1;
  const count = parseInt(r.count, 10) || 1;
  if (r.dir === 'head') {
    return text.slice(0, start - 1) + text.slice(start - 1 + count);
  } else {
    const idx = text.length - (start - 1) - count;
    if (idx < 0) return text.slice(0, Math.max(0, text.length - (start - 1) - count) + count);
    return text.slice(0, idx) + text.slice(idx + count);
  }
}
function applyRuleNumber(text, r, index) {
  const n = (parseInt(r.start, 10) || 1) + index * (parseInt(r.step, 10) || 1);
  const pad = parseInt(r.pad, 10) || 1;
  const num = String(n).padStart(pad, '0');
  let tpl = r.tpl || '<SELF>';
  if (!tpl.includes('<SELF>')) tpl = tpl + ' <SELF>';
  return tpl.replace(/#/g, num).replace(/<SELF>/g, text);
}
function applyRuleAffix(text, r) {
  let t = text;
  if (r.atN) {
    const n = parseInt(r.atN, 10);
    if (!isNaN(n) && n > 0 && n <= t.length + 1) {
      t = t.slice(0, n - 1) + (r.prefix || '') + t.slice(n - 1) + (r.suffix || '');
      return t;
    }
  }
  return (r.prefix || '') + t + (r.suffix || '');
}
function applyRuleRegex(text, r) {
  if (!r.pattern) return text;
  let re;
  try { re = new RegExp(r.pattern, 'g'); }
  catch (e) { return text; }
  return text.replace(re, r.repl || '');
}

function applyAllRules(title, index, type) {
  let t = title;
  if (renameRule.trim.enabled) t = applyRuleTrim(t, renameRule.trim);
  if (renameRule.replace.enabled) t = applyRuleReplace(t, renameRule.replace);
  if (renameRule.del.enabled) t = applyRuleDel(t, renameRule.del);
  if (renameRule.affix.enabled) t = applyRuleAffix(t, renameRule.affix);
  if (renameRule.regex.enabled) t = applyRuleRegex(t, renameRule.regex);
  if (renameRule.number.enabled) t = applyRuleNumber(t, renameRule.number, index);
  return t;
}

function openRenameDialog() {

        </label>

        </span>

  document.getElementById('scope-bookmark').onchange = (e) => {

  document.getElementById('renameCancel').onclick = () => { closeModal(); renderList(); };
  document.getElementById('renameApply').onclick = () => {
    const checked = getCheckedPreviewIds();

    let folderIdx = 0, bmIdx = 0, cnt = 0;
    for (const t of targets) {

      if (type === 'folder' && !renameScope.folders) continue;
      if (type === 'bookmark' && !renameScope.bookmarks) continue;
      if (!checked.has(t.node.id)) continue;
      const idx = type === 'folder' ? folderIdx++ : bmIdx++;
      t.node.title = applyAllRules(t.node.title, idx, type);

    }

    tabBarEl.querySelectorAll('.tab').forEach(el => {

        saveTabPanel();
        renameActiveTab = el.dataset.tab;
        renderTabs();
        renderTabPanel();
      };
    });
  }

  /* ---------- 保存当前 tab 输入 ---------- */
  function saveTabPanel() {
    const t = renameActiveTab;
    const r = renameRule[t];
    const q = (id) => document.getElementById(id);
    if (!q('r-enabled')) return; // 面板还没渲染，跳过
    if (t === 'trim') {

      r.tail = q('r-tail').value;
      r.tailN = parseInt(q('r-tailN').value, 10) || 1;
      r.caseSensitive = q('r-trimCase').checked;
      r.emptyIfNotFound = q('r-trimEmpty').checked;
    } else if (t === 'replace') {
      r.find = q('r-find').value;
      r.repl = q('r-repl').value;
      r.nth = q('r-replNth').value;
      r.caseSensitive = q('r-replCase').checked;
    } else if (t === 'del') {
      r.dir = q('r-delDir').value;
      r.start = parseInt(q('r-delStart').value, 10) || 1;
      r.count = parseInt(q('r-delCount').value, 10) || 1;
    } else if (t === 'number') {
      r.tpl = q('r-numTpl').value;
      r.start = parseInt(q('r-numStart').value, 10) || 1;
      r.step = parseInt(q('r-numStep').value, 10) || 1;
      r.pad = parseInt(q('r-numPad').value, 10) || 1;
    } else if (t === 'affix') {
      r.prefix = q('r-affPrefix').value;
      r.suffix = q('r-affSuffix').value;
      r.atN = q('r-affAtN').value;
    } else if (t === 'regex') {
      r.pattern = q('r-regexPattern').value;
      r.repl = q('r-regexRepl').value;
      r.target = q('r-regexTarget').value;
    }
  }

  /* ---------- 渲染当前 tab 参数面板 ---------- */
  function renderTabPanel() {
    const r = renameRule[renameActiveTab];
    const enabled = r.enabled;
    let html = `<div class="enable-row">
      <input type="checkbox" id="r-enabled" ${enabled ? 'checked' : ''}>
      <label for="r-enabled" style="margin:0; color:var(--text); cursor:pointer;">启用此规则</label>
    </div>`;

    if (renameActiveTab === 'trim') {
      html += `
        <div class="panel-row">
          <div><label>开头词（留空 = 从头）</label>
            <input type="text" id="r-head" value="${escAttr(r.head)}" placeholder="例如 开头词"></div>
          <div class="small"><label>第几个</label>
            <input type="number" id="r-headN" value="${r.headN}" min="1"></div>
        </div>
        <div class="panel-row">
          <div><label>结尾词（留空 = 到尾）</label>
            <input type="text" id="r-tail" value="${escAttr(r.tail)}" placeholder="例如 结尾词"></div>
          <div class="small"><label>第几个</label>
            <input type="number" id="r-tailN" value="${r.tailN}" min="1"></div>
        </div>
        <div style="display:flex; gap:20px; margin-top:10px;">
          <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text);">
            <input type="checkbox" id="r-trimCase" ${r.caseSensitive ? 'checked' : ''}> 区分大小写
          </label>
          <label style="display:flex; align-items:center; gap:6px; margin:0; color:var(--text);">
            <input type="checkbox" id="r-trimEmpty" ${r.emptyIfNotFound ? 'checked' : ''}> 找不到锚点时删空
          </label>
        </div>
        <p class="hint">
          从「开头词」开始保留到「结尾词」结束，两头多余内容删掉。<br>
          例：开头词填 <code>[开头词]</code>，结尾词填 <code>[结尾词]</code><br>
          → <code>[开头词] xxx yyy [结尾词] zzz</code><br>
          → <code>[开头词] xxx yyy [结尾词]</code>
        </p>
      `;
    } else if (renameActiveTab === 'replace') {
      html += `
        <div class="panel-row">
          <div><label>查找</label>
            <input type="text" id="r-find" value="${escAttr(r.find)}" placeholder="要查找的文字"></div>
          <div><label>替换为（留空 = 删除）</label>
            <input type="text" id="r-repl" value="${escAttr(r.repl)}"></div>
          <div class="small"><label>第几个（空=全部）</label>
            <input type="number" id="r-replNth" value="${escAttr(r.nth)}" min="1"></div>
        </div>
        <label style="display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--text);">
          <input type="checkbox" id="r-replCase" ${r.caseSensitive ? 'checked' : ''}> 区分大小写
        </label>
        <p class="hint">例：查找 <code>[查找词]</code>，替换留空 → 删除所有「查找词」。<br>第几个留空 = 替换全部；填 2 = 只替换第 2 个匹配。</p>
      `;
    } else if (renameActiveTab === 'del') {
      html += `
        <div class="panel-row">
          <div><label>方向</label>
            <select id="r-delDir">
              <option value="head" ${r.dir === 'head' ? 'selected' : ''}>从头</option>
              <option value="tail" ${r.dir === 'tail' ? 'selected' : ''}>从尾</option>
            </select></div>
          <div><label>从第 N 个字符开始</label>
            <input type="number" id="r-delStart" value="${r.start}" min="1"></div>
          <div><label>删除 M 个字符</label>
            <input type="number" id="r-delCount" value="${r.count}" min="1"></div>
        </div>
        <p class="hint">例：从头、第 1 个字符开始、删 5 个 → 删掉开头 5 个字。</p>
      `;
    } else if (renameActiveTab === 'number') {
      html += `
        <label>模板（<code>#</code> = 序号，<code>&lt;SELF&gt;</code> = 原标题）</label>
        <input type="text" id="r-numTpl" value="${escAttr(r.tpl)}">
        <div class="panel-row">
          <div><label>起始</label>
            <input type="number" id="r-numStart" value="${r.start}"></div>
          <div><label>步长</label>
            <input type="number" id="r-numStep" value="${r.step}"></div>
          <div><label>位数（补零）</label>
            <input type="number" id="r-numPad" value="${r.pad}" min="1"></div>
        </div>
        <p class="hint">
          例：模板 <code>#. &lt;SELF&gt;</code>，位数 2 → <code>01. 原标题</code>、<code>02. 原标题</code>…<br>
          文件夹和书签各自独立计数。
        </p>
      `;
    } else if (renameActiveTab === 'affix') {
      html += `
        <div class="panel-row">
          <div><label>前缀</label>
            <input type="text" id="r-affPrefix" value="${escAttr(r.prefix)}"></div>
          <div><label>后缀</label>
            <input type="text" id="r-affSuffix" value="${escAttr(r.suffix)}"></div>
        </div>
        <label>从第 N 个字符位置插入（留空 = 直接首尾拼接）</label>
        <input type="number" id="r-affAtN" value="${escAttr(r.atN)}" min="1">
        <p class="hint">例：前缀填 <code>[前缀] </code>，留空 N → <code>[前缀] 原标题</code></p>
      `;
    } else if (renameActiveTab === 'regex') {
      html += `
        <label>作用范围</label>
        <select id="r-regexTarget">
          <option value="title" ${r.target === 'title' ? 'selected' : ''}>仅标题</option>
          <option value="url" ${r.target === 'url' ? 'selected' : ''}>仅网址</option>
          <option value="both" ${r.target === 'both' ? 'selected' : ''}>标题和网址</option>
        </select>
        <label>正则模式</label>
        <input type="text" id="r-regexPattern" value="${escAttr(r.pattern)}" placeholder="例如 ^(.+?) \\|.*$">
        <label>替换为（$1 $2 捕获组，留空 = 删除）</label>
        <input type="text" id="r-regexRepl" value="${escAttr(r.repl)}" placeholder="$1">
        <p class="hint">高级用法，熟悉正则再用。示例：模式 <code>^(.+?) \\|.*$</code> 替换 <code>$1</code> → 保留第一个竖线之前的内容。</p>
      `;
    }

    panelEl.innerHTML = html;

    // 启用开关
    document.getElementById('r-enabled').onchange = (e) => {
      renameRule[renameActiveTab].enabled = e.target.checked;
      renderTabs();
      refreshPreview();
    };
    // 输入实时刷新
    panelEl.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => { saveTabPanel(); refreshPreview(); });
      el.addEventListener('change', () => { saveTabPanel(); refreshPreview(); });
    });
  }

  /* ---------- 预览表渲染 ---------- */
  const PREVIEW_COLS = [
    { key: 'chk',   label: '',       def: 34,  fixed: true },
    { key: 'old',   label: '原始',   def: 420, fixed: true },
    { key: 'arrow', label: '',       def: 30,  fixed: true },
    { key: 'new',   label: '改后',   def: 420, fixed: true },
  ];

  function refreshPreview() {
    if (!previewInnerEl) return;

    // 过滤掉不参与的类型
    const visible = targets.filter(t => {
      const type = t.node.type;
      if (type === 'folder' && !renameScope.folders) return false;
      if (type === 'bookmark' && !renameScope.bookmarks) return false;
      return true;
    });

    // 计算每列宽度
    const colW = {};
    let totalW = 0;
    PREVIEW_COLS.forEach(c => {
      const w = window.__previewColWidths[c.key] || c.def;
      colW[c.key] = w;
      totalW += w + 5;
    });

    // 表头
    let html = '<div class="preview-header">';
    PREVIEW_COLS.forEach(c => {
      const w = colW[c.key];
      html += `<div class="pcol ${c.key === 'chk' ? 'chk-col' : ''}" data-pkey="${c.key}" style="width:${w}px">${c.label}</div>`;
      if (c.fixed) html += `<div class="splitter" data-pkey="${c.key}"></div>`;
    });
    html += '</div>';

    // 行
    let folderIdx = 0, bmIdx = 0;
    visible.forEach(t => {
      const type = t.node.type;
      const idx = type === 'folder' ? folderIdx++ : bmIdx++;
      const oldT = t.node.title;
      const newT = applyAllRules(oldT, idx, type);
      const checked = window.__renameChecked.get(t.node.id) !== false;
      const folderMark = type === 'folder' ? '📁 ' : '';

      html += `<div class="preview-row ${checked ? '' : 'disabled'}" data-id="${t.node.id}"><div class="row-inner">`;
      PREVIEW_COLS.forEach(c => {
        const w = colW[c.key];
        if (c.key === 'chk') {
          html += `<div class="pcol chk-col" data-pkey="chk" style="width:${w}px"><input type="checkbox" class="preview-chk" data-id="${t.node.id}" ${checked ? 'checked' : ''}></div>`;
        } else if (c.key === 'old') {
          html += `<div class="pcol old" data-pkey="old" style="width:${w}px" title="${escAttr(oldT)}">${esc(folderMark + oldT)}</div>`;
        } else if (c.key === 'arrow') {
          html += `<div class="pcol arrow" data-pkey="arrow" style="width:${w}px">→</div>`;
        } else if (c.key === 'new') {
          html += `<div class="pcol new" data-pkey="new" style="width:${w}px" title="${escAttr(newT)}">${esc(folderMark + newT)}</div>`;
        }
        if (c.fixed) html += `<div class="splitter" data-pkey="${c.key}"></div>`;
      });
      html += '</div></div>';
    });

    previewInnerEl.innerHTML = html;
    previewInnerEl.style.minWidth = totalW + 'px';

    // 勾选
    previewInnerEl.querySelectorAll('.preview-chk').forEach(cb => {
      cb.onchange = (e) => {
        window.__renameChecked.set(cb.dataset.id, e.target.checked);
        const row = cb.closest('.preview-row');
        if (e.target.checked) row.classList.remove('disabled');
        else row.classList.add('disabled');
      };
    });

    // 列宽拖拽
    previewInnerEl.querySelectorAll('.preview-header .splitter').forEach(sp => {
      sp.onmousedown = (e) => {
        e.preventDefault();
        const key = sp.dataset.pkey;
        const startX = e.clientX;
        const startW = window.__previewColWidths[key] || PREVIEW_COLS.find(c => c.key === key).def;
        const onMove = (ev) => {
          let w = startW + (ev.clientX - startX);
          if (w < 30) w = 30;
          if (w > 1200) w = 1200;
          window.__previewColWidths[key] = w;
          previewInnerEl.querySelectorAll(`[data-pkey="${key}"]`).forEach(el => el.style.width = w + 'px');
          let total = 0;
          PREVIEW_COLS.forEach(c => { total += (window.__previewColWidths[c.key] || c.def) + 5; });
          previewInnerEl.style.minWidth = total + 'px';
        };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      };
    });
  }

  function getCheckedPreviewIds() {
    const out = new Set();
    previewInnerEl.querySelectorAll('.preview-chk').forEach(cb => {
      if (cb.checked) out.add(cb.dataset.id);
    });
    return out;
  }

  /* ---------- 初始化：先 tab 栏、再面板、最后预览 ---------- */
  renderTabs();
  renderTabPanel();
  refreshPreview();
}

/* ============================================================
 *  失效检测
 * ============================================================ */
async function checkLinks() {
  if (!currentFolder && !searchQuery) return;
  const items = (searchQuery ? currentSearchResults : getVisibleItems()).filter(i => i.type === 'bookmark');
  if (!items.length) { setStatus('当前视图没有书签'); return; }
  if (items.length > 200 && !confirm(`当前有 ${items.length} 个书签，检测可能较慢。继续？`)) return;

  setStatus('开始检测 ' + items.length + ' 个链接...');
  let done = 0, ok = 0, bad = 0, idx = 0;
  const CONCURRENCY = 8;

  async function worker() {
    while (idx < items.length) {
      const it = items[idx++];
      it.linkStatus = 'pending';
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 8000);
        await fetch(it.url, { method: 'GET', mode: 'no-cors', signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(timer);
        it.linkStatus = 'ok'; ok++;
      } catch (e) { it.linkStatus = 'bad'; bad++; }
      done++;
      if (done % 5 === 0 || done === items.length) {
        setStatus(`检测进度 ${done}/${items.length}（可用 ${ok}，疑似失效 ${bad}）`);
        if (searchQuery) doSearch(searchQuery); else renderList();
      }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  if (searchQuery) doSearch(searchQuery); else renderList();
  setStatus(`检测完成：可用 ${ok}，疑似失效 ${bad}（浏览器限制，仅供参考）`);
}

/* ============================================================
 *  搜索
 * ============================================================ */
let currentSearchResults = [];
function doSearch(q) {
  searchQuery = q.trim();
  if (!searchQuery) { currentSearchResults = []; renderList(); return; }
  if (!root) return;
  const results = [];
  const ql = searchQuery.toLowerCase();
  walkAll(root, (n) => {
    if (n.type === 'bookmark' &&
        ((n.title || '').toLowerCase().includes(ql) || (n.url || '').toLowerCase().includes(ql))) {
      results.push(n);
    }
  });
  currentSearchResults = results;
  renderList();
}

/* ============================================================
 *  框选
 * ============================================================ */
function setupMarquee() {
  const listEl = document.getElementById('list');
  const box = document.getElementById('marquee');
  let dragging = false, startX = 0, startY = 0, additive = false;

  listEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.list-item')) return;
    dragging = true;
    additive = e.ctrlKey || e.metaKey;
    startX = e.clientX; startY = e.clientY;
    box.style.display = 'block';
    box.style.left = startX + 'px'; box.style.top = startY + 'px';
    box.style.width = '0px'; box.style.height = '0px';
    if (!additive) { selectedIds.clear(); updateSelectionInfo(); }
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const x1 = Math.min(startX, e.clientX), y1 = Math.min(startY, e.clientY);
    const x2 = Math.max(startX, e.clientX), y2 = Math.max(startY, e.clientY);
    box.style.left = x1 + 'px'; box.style.top = y1 + 'px';
    box.style.width = (x2 - x1) + 'px'; box.style.height = (y2 - y1) + 'px';
    const rect = { left: x1, top: y1, right: x2, bottom: y2 };
    const rows = listEl.querySelectorAll('.list-item');
    const newSel = additive ? new Set(selectedIds) : new Set();
    rows.forEach(r => {
      const rr = r.getBoundingClientRect();
      const hit = !(rr.right < rect.left || rr.left > rect.right || rr.bottom < rect.top || rr.top > rect.bottom);
      if (hit) newSel.add(r.dataset.id);
    });
    rows.forEach(r => {
      if (newSel.has(r.dataset.id)) r.classList.add('selected');
      else r.classList.remove('selected');
    });
    selectedIds = newSel;
    updateSelectionInfo();
  });
  document.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    box.style.display = 'none';
    updateSelectionInfo();
    if (Math.abs(e.clientX - startX) < 4 && Math.abs(e.clientY - startY) < 4) {
      if (!additive) {
        selectedIds.clear();
        document.querySelectorAll('.list-item.selected').forEach(el => el.classList.remove('selected'));
        updateSelectionInfo();
      }
    }
  });
}

/* ============================================================
 *  右键菜单
 * ============================================================ */
function showContextMenu(x, y, node) {
  const menu = document.getElementById('ctxMenu');
  menu.innerHTML = '';
  const add = (label, fn, danger = false) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (danger) b.className = 'danger';
    b.onclick = () => { hideContextMenu(); fn(); };
    menu.appendChild(b);
  };
  const sep = () => menu.appendChild(Object.assign(document.createElement('div'), { className: 'sep' }));

  if (node.type === 'bookmark') {
    add('🔗 打开链接', () => window.open(node.url, '_blank'));
    add('✏️ 重命名 (F2)', () => beginInlineEdit(node));
    add('🌐 编辑 URL', () => {
      const url = prompt('新 URL：', node.url);
      if (url !== null) { node.url = url; if (searchQuery) doSearch(searchQuery); else renderList(); }
    });
    sep();
    add('📋 复制 URL', () => navigator.clipboard.writeText(node.url));
  } else {
    add('✏️ 重命名 (F2)', () => beginInlineEdit(node));
    add('📁 在此新建文件夹', () => {
      const name = prompt('新文件夹名称：', '新建文件夹');
      if (name !== null) {
        const f = newFolder(name.trim() || '新建文件夹');
        node.children.unshift(f);
        renderTree(); renderList();
        beginInlineEdit(f);
      }
    });
  }
  sep();
  add('💾 导出选中项为 HTML', () => exportSelected());
  add('✏️ 批量改名', () => openRenameDialog());
  sep();
  if (selectedIds.size > 1) {
    add(`🗑 删除选中的 ${selectedIds.size} 项`, deleteSelected, true);
  } else {
    add('🗑 删除', () => {
      if (node === root) { alert('不能删除根'); return; }
      if (!confirm('确定删除「' + node.title + '」？')) return;
      const r = findById(node.id);
      if (r && r.parent) r.parent.children = r.parent.children.filter(c => c.id !== node.id);
      if (currentFolder === node) currentFolder = r.parent || root;
      renderTree(); if (searchQuery) doSearch(searchQuery); else renderList();
    }, true);
  }
  menu.style.left = x + 'px'; menu.style.top = y + 'px'; menu.style.display = 'block';
}
function hideContextMenu() { document.getElementById('ctxMenu').style.display = 'none'; }
document.addEventListener('click', hideContextMenu);

function showModal(title, bodyHtml, buttons = [{ label: '关闭', action: closeModal }]) {
  const box = document.getElementById('modalBox');
  box.style.width = '';
  box.style.height = '';
  box.style.maxWidth = '96vw';
  box.style.maxHeight = '92vh';
  box.innerHTML = `<h3>${title}</h3><div class="modal-body">${bodyHtml}</div>`;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (b.primary) btn.className = 'primary';
    btn.onclick = b.action;
    actions.appendChild(btn);
  }
  box.appendChild(actions);
  document.getElementById('modalMask').classList.add('show');
}
